<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beniz'in gezegeni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=MonteCarlo&display=swap" rel="stylesheet">
<style>
:root { --ink: #0d1325; --deep: #070919; --gold: #f0bf4c; --pink: #ffc4d8; --text: #f4ead6; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body { background: var(--deep); color: var(--text); overflow: hidden; font-family: "Cormorant Garamond", Georgia, serif;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas.drag { cursor: grabbing; }
canvas.over { cursor: pointer; }

.head { position: fixed; left: 0; right: 0; top: max(5vh, env(safe-area-inset-top) + 18px); text-align: center; pointer-events: none; padding: 0 16px; }
.head h1 { margin: 0; font-family: "MonteCarlo", cursive; font-weight: 400; color: var(--pink); font-size: min(80px, 9.4vw); line-height: 1.1;
  text-shadow: 0 2px 18px rgba(7, 9, 25, 0.8); opacity: 0; transform: translateY(8px); animation: rise 1.6s ease 1.2s forwards; }
.hint { position: fixed; left: 0; right: 0; bottom: max(4.5vh, env(safe-area-inset-bottom) + 16px); margin: 0; text-align: center; pointer-events: none; padding: 0 16px;
  font-style: italic; font-weight: 500; font-size: clamp(17px, 4.4vw, 22px); color: rgba(244, 234, 214, 0.75);
  text-shadow: 0 1px 12px rgba(7, 9, 25, 0.9); opacity: 0; animation: rise 1.4s ease 3.2s forwards; }
@keyframes rise { to { opacity: 1; transform: none; } }

/* the sections as real links, for keyboards and screen readers; they show only when focused */
.nav { position: fixed; left: 12px; top: 12px; display: flex; gap: 8px; }
.nav a { position: absolute; left: -9999px; padding: 8px 14px; border-radius: 999px; background: var(--ink); color: var(--pink); font-style: italic; font-size: 18px; text-decoration: none; white-space: nowrap; }
.nav a:focus { position: static; outline: 2px solid var(--gold); outline-offset: 2px; }

.veil { position: fixed; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }
.veil.on { opacity: 1; }

.skip .head h1, .skip .hint { animation: none; opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .head h1, .hint { animation-duration: 0.01s; animation-delay: 0s; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<p class="hint">Gezegeni çevir, ışıklara dokun</p>
<nav class="nav" id="nav" aria-label="Bölümler"></nav>
<div class="veil" id="veil"></div>

<script>
// ---------- edit me ----------
const CONFIG = {
  // each section is something big growing on the planet, with a beam of light over it. Tapping it opens its folder.
  // lat / lon: where it stands on the planet (degrees). size: its height, as a fraction of the planet's radius.
  sections: [
    { title: "Doğum günü", href: "dogum-gunu/index.html", object: "cake", lat: 38, lon: 0, size: 0.56, colour: "#ffd98a" },
    { title: "Randevu", href: "randevu/index.html", object: "cocktail", lat: -4, lon: 12, size: 0.5, colour: "#ffb3cd" },
  ],
  // little things living on the planet; tapping one makes it say something
  eggs: [
    { object: "pumpkin", says: "Balkabağı",     lat: -14, lon: 74,   size: 0.26 },
    { object: "crown",   says: "Kürk prensesi", lat: 20,  lon: 150,  size: 0.3 },
    { object: "clover",  says: "Şans meleği",   lat: -36, lon: -56,  size: 0.34 },
    { object: "scales",  says: "Avukat hanım",  lat: 46,  lon: -112, size: 0.38 },
  ],
  labels: false, // true = write each section's title above it
  moonSays: "Altın küre", // the little golden moon
  shootingStars: true,
};

(() => {
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  const veil = document.getElementById("veil"), nav = document.getElementById("nav");
  const TAU = Math.PI * 2, rad = d => d * Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3), easeIn = t => t * t * t;
  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 100, stars = [], haze = null, born = performance.now();
  if (document.fonts && document.fonts.load) { document.fonts.load('30px "MonteCarlo"'); document.fonts.load('italic 500 22px "Cormorant Garamond"'); }

  // ---------- a little 3D: the planet is a ball, turned by a rotation matrix ----------
  const mul = (A, B) => { const C = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) C[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j]; return C; };
  const ap = (M, v) => [M[0] * v[0] + M[1] * v[1] + M[2] * v[2], M[3] * v[0] + M[4] * v[1] + M[5] * v[2], M[6] * v[0] + M[7] * v[1] + M[8] * v[2]];
  const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  function rot(axis, a) { // turn by angle a around an axis
    const [x, y, z] = norm(axis), c = Math.cos(a), s = Math.sin(a), k = 1 - c;
    return [c + x * x * k, x * y * k - z * s, x * z * k + y * s, y * x * k + z * s, c + y * y * k, y * z * k - x * s, z * x * k - y * s, z * y * k + x * s, c + z * z * k];
  }
  const between = (a, b) => { const ax = cross(a, b), l = Math.hypot(ax[0], ax[1], ax[2]); return l < 1e-6 ? null : { axis: ax, angle: Math.atan2(l, dot(a, b)) }; };
  const dir = (lat, lon) => [Math.cos(rad(lat)) * Math.sin(rad(lon)), Math.sin(rad(lat)), Math.cos(rad(lat)) * Math.cos(rad(lon))];
  const FRONT = norm([-0.12, 0.6, 0.79]); // where a chosen thing is turned to: up front, standing tall

  // ---------- who lives here ----------
  const SECS = (CONFIG.sections || []).filter(s => s && s.href).map(s => ({ ...s, p: dir(s.lat, s.lon), section: true, ph: Math.random() * 6 }));
  const EGGS = (CONFIG.eggs || []).map(e => ({ ...e, p: dir(e.lat, e.lon), ph: Math.random() * 6 }));
  const DECOR = [
    ["tree", 14, 66, 0.3, 0], ["tree", -30, 20, 0.24, 1], ["tree", 62, 60, 0.26, 1], ["tree", -24, -14, 0.26, 0], ["tree", 34, -84, 0.3, 1],
    ["tree", -52, 110, 0.26, 0], ["tree", 40, 108, 0.22, 0], ["tree", -20, -150, 0.3, 1], ["tree", 10, -100, 0.22, 0], ["tree", -62, -100, 0.24, 1],
    ["house", -40, 168, 0.3, 0], ["tree", 66, -170, 0.24, 0], ["tree", 4, 118, 0.2, 1],
  ].map(([object, lat, lon, size, kind]) => ({ object, p: dir(lat, lon), size, kind, ph: Math.random() * 6 }));
  const THINGS = [...SECS, ...EGGS, ...DECOR];
  for (const s of SECS) { const a = document.createElement("a"); a.href = s.href; a.textContent = s.title; nav.append(a); }

  const first = SECS[0] || EGGS[0] || DECOR[0];
  const b0 = between(first.p, FRONT);
  const R0 = b0 ? rot(b0.axis, b0.angle) : [1, 0, 0, 0, 1, 0, 0, 0, 1]; // the planet starts with the first section in front
  let Rm = R0, intro = !reduced, vx = 0, vy = 0, lastTouch = -10;

  // ---------- the sky behind ----------
  function build() {
    DPR = Math.min(devicePixelRatio || 1, 3);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cx = W / 2; cy = H * 0.5; R = Math.min(W * 0.34, H * 0.3);
    buildPlanet();
    const n = Math.round(clamp(W * H / 2400, 140, 520));
    stars = Array.from({ length: n }, () => {
      const z = Math.random() ** 2, w = Math.random();
      return { x: Math.random() * W, y: Math.random() * H, s: 0.4 + z * 1.3, z, ph: Math.random() * 6.3, sp: 0.6 + Math.random() * 1.8,
        col: w < 0.15 ? "255,214,170" : w < 0.3 ? "200,215,255" : "255,250,240" };
    });
    haze = document.createElement("canvas"); haze.width = cv.width; haze.height = cv.height;
    const h = haze.getContext("2d"); h.scale(DPR, DPR);
    const g = h.createLinearGradient(0, 0, W * 0.4, H);
    g.addColorStop(0, "#0a0d24"); g.addColorStop(0.5, "#161538"); g.addColorStop(1, "#090a1c");
    h.fillStyle = g; h.fillRect(0, 0, W, H);
    const blobs = [[0.2, 0.25, "150,90,190"], [0.8, 0.7, "90,110,200"], [0.75, 0.2, "220,110,160"], [0.15, 0.8, "110,90,190"]];
    for (const [bx, by, c] of blobs) {
      const r = Math.max(W, H) * 0.42, rg = h.createRadialGradient(bx * W, by * H, 0, bx * W, by * H, r);
      rg.addColorStop(0, `rgba(${c},0.16)`); rg.addColorStop(1, `rgba(${c},0)`);
      h.fillStyle = rg; h.fillRect(0, 0, W, H);
    }
  }

  // ---------- drawing the things. Each is drawn 1 unit tall, standing on (0,0), growing up (towards -y) ----------
  const el = (x, y, rx, ry, r, fill) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, r || 0, 0, TAU); ctx.fill(); };
  const DRAW = {
    kiku(t, o) {
      ctx.rotate(Math.sin(t * 1.3 + o.ph) * 0.04);
      ctx.strokeStyle = "#4fae7a"; ctx.lineWidth = 0.05; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(0.07, -0.35, 0, -0.7); ctx.stroke();
      el(0.14, -0.26, 0.15, 0.055, -0.5, "#63c48d"); el(-0.13, -0.4, 0.14, 0.05, 0.5, "#57b981");
      ctx.translate(0, -0.72);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 0.62);
      g.addColorStop(0, "rgba(255,170,205,0.55)"); g.addColorStop(1, "rgba(255,170,205,0)");
      ctx.fillStyle = g; ctx.fillRect(-0.62, -0.62, 1.24, 1.24);
      const turn = reduced ? 0 : t * 0.12;
      for (const [n, r, w, col, off] of [[20, 0.29, 0.05, "#ff7fae", 0], [16, 0.23, 0.047, "#ff9dc0", 0.2], [12, 0.165, 0.042, "#ffbdd3", 0.1], [8, 0.1, 0.035, "#ffd9e6", 0.3]]) {
        for (let i = 0; i < n; i++) { const a = turn + off + i * TAU / n; el(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55, r * 0.5, w, a, col); }
      }
      el(0, 0, 0.045, 0.045, 0, "#ffe08a");
    },
    cake(t, o) { // a two-tier birthday cake with one candle
      const tier = (y0, y1, rx, body, top) => { // a round tier seen a little from above
        ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, y0, rx, rx * 0.22, 0, 0, Math.PI); ctx.lineTo(-rx, y1); ctx.lineTo(rx, y1); ctx.fill();
        el(0, y1, rx, rx * 0.22, 0, top);
      };
      const g = ctx.createRadialGradient(0, -0.5, 0, 0, -0.5, 0.75);
      g.addColorStop(0, "rgba(255,215,150,0.4)"); g.addColorStop(1, "rgba(255,215,150,0)");
      ctx.fillStyle = g; ctx.fillRect(-0.75, -1.25, 1.5, 1.5);
      el(0, -0.05, 0.5, 0.12, 0, "#e0a730"); el(0, -0.07, 0.5, 0.11, 0, "#f6c64f");
      tier(-0.09, -0.36, 0.4, "#f3e3cc", "#ff9dc0");
      ctx.fillStyle = "#ff9dc0"; // icing running down the side
      for (let i = 0; i < 7; i++) { const x = -0.34 + i * 0.113, d = 0.07 + 0.05 * Math.sin(i * 2.4 + 1); ctx.beginPath(); ctx.ellipse(x, -0.31 + Math.cos(x * 2.4) * 0.05, 0.05, d, 0, 0, TAU); ctx.fill(); }
      for (let i = 0; i < 6; i++) el(-0.3 + i * 0.12, -0.17 + Math.cos((-0.3 + i * 0.12) * 2.4) * 0.05, 0.022, 0.022, 0, i % 2 ? "#f6c64f" : "#ff7fae");
      tier(-0.38, -0.6, 0.25, "#fff1dc", "#ffc4d8");
      ctx.fillStyle = "#ffc4d8";
      for (let i = 0; i < 5; i++) { const x = -0.2 + i * 0.1, d = 0.05 + 0.03 * Math.sin(i * 3.1); ctx.beginPath(); ctx.ellipse(x, -0.56 + Math.cos(x * 4) * 0.03, 0.04, d, 0, 0, TAU); ctx.fill(); }
      ctx.fillStyle = "#fffaf0"; ctx.fillRect(-0.03, -0.82, 0.06, 0.22);
      ctx.fillStyle = "#ff7fae"; for (let i = 0; i < 3; i++) ctx.fillRect(-0.03, -0.79 + i * 0.07, 0.06, 0.025);
      const fl = reduced ? 0 : Math.sin(t * 11 + o.ph) * 0.012 + Math.sin(t * 7.3) * 0.01;
      el(0, -0.9, 0.16, 0.16, 0, "rgba(255,210,120,0.35)");
      el(fl, -0.9, 0.045, 0.085 + fl, fl * 4, "#ffb347"); el(fl * 0.6, -0.885, 0.024, 0.05, 0, "#fff3c4");
    },
    cocktail(t, o) { // a cocktail glass with a cherry, a lemon slice and a straw
      const g = ctx.createRadialGradient(0, -0.7, 0, 0, -0.7, 0.7);
      g.addColorStop(0, "rgba(255,170,205,0.4)"); g.addColorStop(1, "rgba(255,170,205,0)");
      ctx.fillStyle = g; ctx.fillRect(-0.7, -1.4, 1.4, 1.4);
      const glass = "rgba(236,246,255,0.92)";
      el(0, -0.04, 0.23, 0.06, 0, glass); el(0, -0.055, 0.17, 0.035, 0, "rgba(160,190,230,0.5)");
      ctx.fillStyle = glass; ctx.fillRect(-0.017, -0.5, 0.034, 0.46);
      ctx.strokeStyle = "#f6c64f"; ctx.lineWidth = 0.035; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-0.08, -0.62); ctx.lineTo(-0.3, -1.16); ctx.stroke(); // the straw
      ctx.fillStyle = "rgba(236,246,255,0.3)"; ctx.beginPath(); ctx.moveTo(-0.38, -0.95); ctx.lineTo(0.38, -0.95); ctx.lineTo(0, -0.47); ctx.fill();
      const lq = ctx.createLinearGradient(0, -0.87, 0, -0.5); lq.addColorStop(0, "#ff7fae"); lq.addColorStop(1, "#ffb155");
      ctx.fillStyle = lq; ctx.beginPath(); ctx.moveTo(-0.31, -0.86); ctx.lineTo(0.31, -0.86); ctx.lineTo(0, -0.48); ctx.fill();
      el(0, -0.86, 0.31, 0.045, 0, "#ffa9c8");
      if (!reduced) for (let i = 0; i < 3; i++) { const k = (t * 0.5 + i / 3 + o.ph) % 1; el(-0.08 + i * 0.08, -0.56 - k * 0.26, 0.016, 0.016, 0, `rgba(255,255,255,${0.7 * (1 - k)})`); }
      el(0.1, -0.86, 0.06, 0.06, 0, "#e0284f"); el(0.085, -0.88, 0.018, 0.018, 0, "#ff9db4");
      ctx.strokeStyle = glass; ctx.lineWidth = 0.022; ctx.beginPath(); ctx.ellipse(0, -0.95, 0.38, 0.05, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = "#ffe066"; ctx.beginPath(); ctx.arc(0.36, -0.96, 0.12, Math.PI * 1.15, Math.PI * 0.15); ctx.fill(); // the lemon slice on the rim
      ctx.fillStyle = "#fff6c2"; ctx.beginPath(); ctx.arc(0.36, -0.96, 0.08, Math.PI * 1.15, Math.PI * 0.15); ctx.fill();
    },
    pumpkin() {
      el(-0.34, -0.4, 0.26, 0.36, 0, "#e9812a"); el(0.34, -0.4, 0.26, 0.36, 0, "#e9812a");
      el(-0.18, -0.4, 0.27, 0.39, 0, "#f6983a"); el(0.18, -0.4, 0.27, 0.39, 0, "#f6983a");
      el(0, -0.4, 0.22, 0.4, 0, "#ffb155");
      ctx.fillStyle = "#4fae7a"; ctx.beginPath(); ctx.moveTo(-0.06, -0.76); ctx.quadraticCurveTo(-0.02, -0.92, 0.1, -1); ctx.lineTo(0.16, -0.93); ctx.quadraticCurveTo(0.07, -0.88, 0.07, -0.76); ctx.fill();
      ctx.strokeStyle = "#5a2d12"; ctx.lineWidth = 0.035; ctx.lineCap = "round"; // a sleepy, happy face
      ctx.beginPath(); ctx.arc(-0.17, -0.44, 0.06, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(0.17, -0.44, 0.06, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -0.36, 0.07, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
      el(-0.3, -0.33, 0.06, 0.04, 0, "rgba(255,120,150,0.55)"); el(0.3, -0.33, 0.06, 0.04, 0, "rgba(255,120,150,0.55)");
    },
    crown() { // a crown with a fur trim, on its cushion
      el(0, -0.13, 0.5, 0.15, 0, "#7a4fb8"); el(0, -0.17, 0.44, 0.11, 0, "#9a6fd6");
      ctx.fillStyle = "#f6c64f"; ctx.beginPath();
      ctx.moveTo(-0.34, -0.36); ctx.lineTo(-0.42, -0.86); ctx.lineTo(-0.2, -0.62); ctx.lineTo(0, -0.98); ctx.lineTo(0.2, -0.62); ctx.lineTo(0.42, -0.86); ctx.lineTo(0.34, -0.36); ctx.fill();
      ctx.fillStyle = "#e0a730"; ctx.fillRect(-0.34, -0.5, 0.68, 0.06);
      el(-0.42, -0.87, 0.05, 0.05, 0, "#ff8fb6"); el(0.42, -0.87, 0.05, 0.05, 0, "#ff8fb6"); el(0, -0.99, 0.06, 0.06, 0, "#ff8fb6"); el(0, -0.62, 0.05, 0.05, 0, "#ff6f9f");
      for (let i = 0; i < 7; i++) el(-0.36 + i * 0.12, -0.34, 0.085, 0.085, 0, "#fffaf2");
      for (let i = 0; i < 6; i++) el(-0.3 + i * 0.12, -0.33, 0.018, 0.03, 0.3, "#3a2a3a");
    },
    clover(t, o) { // a four-leaf clover with a halo and little wings
      ctx.rotate(Math.sin(t * 1.6 + o.ph) * 0.05);
      ctx.strokeStyle = "#3f9c68"; ctx.lineWidth = 0.05; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(0.08, -0.25, 0, -0.5); ctx.stroke();
      const flap = reduced ? 0 : Math.sin(t * 5 + o.ph) * 0.25;
      el(-0.36, -0.64, 0.18, 0.08, 0.35 + flap, "rgba(255,255,255,0.92)"); el(0.36, -0.64, 0.18, 0.08, -0.35 - flap, "rgba(255,255,255,0.92)");
      for (let i = 0; i < 4; i++) {
        const a = Math.PI / 4 + i * Math.PI / 2, x = Math.cos(a) * 0.15, y = -0.6 + Math.sin(a) * 0.15;
        el(x + Math.cos(a + 0.9) * 0.06, y + Math.sin(a + 0.9) * 0.06, 0.1, 0.1, 0, "#4fc487"); el(x + Math.cos(a - 0.9) * 0.06, y + Math.sin(a - 0.9) * 0.06, 0.1, 0.1, 0, "#4fc487");
        el(x, y, 0.06, 0.06, 0, "#74dca3");
      }
      ctx.strokeStyle = "#ffd76a"; ctx.lineWidth = 0.035; ctx.beginPath(); ctx.ellipse(0, -0.94, 0.17, 0.05, 0, 0, TAU); ctx.stroke();
    },
    scales(t, o) { // the scales of justice
      const gold = "#f6c64f", tilt = reduced ? 0.05 : Math.sin(t * 1.1 + o.ph) * 0.13, by = -0.84, arm = 0.4;
      ctx.fillStyle = "#e0a730"; ctx.beginPath(); ctx.moveTo(-0.24, 0); ctx.lineTo(0.24, 0); ctx.lineTo(0.1, -0.09); ctx.lineTo(-0.1, -0.09); ctx.fill();
      ctx.fillStyle = gold; ctx.fillRect(-0.028, -0.9, 0.056, 0.84); el(0, -0.93, 0.06, 0.06, 0, gold);
      ctx.strokeStyle = gold; ctx.lineCap = "round";
      for (const sgn of [-1, 1]) {
        const ex = sgn * arm * Math.cos(tilt), ey = by + sgn * arm * Math.sin(tilt);
        ctx.lineWidth = 0.045; ctx.beginPath(); ctx.moveTo(0, by); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.lineWidth = 0.018; ctx.beginPath(); ctx.moveTo(ex - 0.13, ey + 0.3); ctx.lineTo(ex, ey); ctx.lineTo(ex + 0.13, ey + 0.3); ctx.stroke();
        ctx.fillStyle = gold; ctx.beginPath(); ctx.ellipse(ex, ey + 0.3, 0.15, 0.085, 0, 0, Math.PI); ctx.fill();
      }
    },
    house(t) {
      ctx.fillStyle = "#c95a82"; ctx.fillRect(0.14, -0.92, 0.1, 0.24);

  }
  cv.addEventListener("pointerdown", e => {
    if (leaving) return;
    intro = false;
    drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: 0, t: performance.now() };
    vx = vy = 0; cv.setPointerCapture(e.pointerId); cv.classList.add("drag");
  });
  cv.addEventListener("pointermove", e => {
    if (!drag) { cv.classList.toggle("over", !leaving && !!pick(e.clientX, e.clientY)); return; }
    const now = performance.now(), dx = e.clientX - drag.x, dy = e.clientY - drag.y, dt = Math.max(0.008, (now - drag.t) / 1000);
    drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy));
    spin(dx, dy);
    vx = vx * 0.5 + (dx / dt) * 0.5; vy = vy * 0.5 + (dy / dt) * 0.5;
    drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
  });
  const drop = e => {
    if (!drag) return;
    const d = drag; drag = null; cv.classList.remove("drag");
    lastTouch = (performance.now() - born) / 1000;
    if (performance.now() - d.t > 80) vx = vy = 0; // she stopped before letting go: no flick
    if (e.type !== "pointerup" || d.moved > 9) return;
    vx = vy = 0;
    const o = pick(e.clientX, e.clientY);
    if (!o) return;
    if (o.section) return go(o);
    o.bt = lastTouch; burst(o.mx, o.my);
  };
  cv.addEventListener("pointerup", drop); cv.addEventListener("pointercancel", drop);

  // going in: the planet turns the chosen thing to the front, then the camera dives into it
  function go(o) {
    if (leaving) return;
    leaving = { o, zoom0: null }; intro = false; cv.classList.remove("over");
    o.bt = (performance.now() - born) / 1000; burst(o.mx, o.my);
    if (reduced) { veil.classList.add("on"); setTimeout(() => { location.href = o.href; }, 300); }
  }
  addEventListener("pageshow", e => { if (e.persisted) { leaving = null; veil.classList.remove("on"); } }); // back from a section

  // ---------- one frame ----------
  let shots = [], nextShot = 4, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000), t = (now - born) / 1000; last = now;

    // how the planet is turned
    let sceneK = 1;
    if (intro) {
      const k = clamp(t / 2.8, 0, 1);
      Rm = mul(rot([0.15, 1, 0], -4.2 * (1 - easeOut(k))), R0); sceneK = 0.55 + 0.45 * easeOut(clamp(t / 2.2, 0, 1));
      if (k >= 1) { intro = false; lastTouch = t - 2; }
    } else if (leaving) {
      const b = between(ap(Rm, leaving.o.p), FRONT);
      if (b && b.angle > 0.015) Rm = mul(rot(b.axis, Math.min(b.angle, Math.max(b.angle * 6, 0.6) * dt)), Rm);
      else if (leaving.zoom0 == null && !reduced) {
        leaving.zoom0 = now;
        setTimeout(() => veil.classList.add("on"), 550);
        setTimeout(() => { location.href = leaving.o.href; }, 1400);
      }
    } else if (!drag) {
      if (Math.abs(vx) + Math.abs(vy) > 2) { spin(vx * dt, vy * dt); const d = Math.exp(-dt * 2.2); vx *= d; vy *= d; lastTouch = t; }
      else if (!reduced && t - lastTouch > 3.5) Rm = mul(rot([0.15, 1, 0], 0.1 * dt * clamp((t - lastTouch - 3.5) / 2, 0, 1)), Rm); // left alone, it turns slowly
    }
    for (const o of THINGS) place(o);
    placeMoon(t);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1; ctx.drawImage(haze, 0, 0, W, H);
    const fade = reduced ? 1 : clamp(t / 1.8, 0, 1);
    for (const p of stars) {
      const tw = reduced ? 0.8 : 0.55 + 0.45 * Math.sin(t * p.sp + p.ph);
      ctx.fillStyle = `rgba(${p.col},${(0.25 + p.z * 0.75) * tw * fade})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s * 0.6, 0, TAU); ctx.fill();
    }
    if (CONFIG.shootingStars && !reduced && t > nextShot) {
      nextShot = t + 4 + Math.random() * 6;
      const down = Math.PI * (0.12 + Math.random() * 0.16);
      shots.push({ x: W * (0.15 + Math.random() * 0.7), y: H * (0.04 + Math.random() * 0.25), a: Math.random() < 0.5 ? down : Math.PI - down, t0: t, life: 0.9 + Math.random() * 0.5 });
    }
    for (const sh of shots) {
      const k = (t - sh.t0) / sh.life, d = Math.max(W, H) * 0.55 * k, x = sh.x + Math.cos(sh.a) * d, y = sh.y + Math.sin(sh.a) * d, len = 90 * Math.sin(Math.PI * k);
      const g = ctx.createLinearGradient(x, y, x - Math.cos(sh.a) * len, y - Math.sin(sh.a) * len);
      g.addColorStop(0, `rgba(255,248,230,${0.9 * Math.sin(Math.PI * k)})`); g.addColorStop(1, "rgba(255,248,230,0)");
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(sh.a) * len, y - Math.sin(sh.a) * len); ctx.stroke();
    }
    shots = shots.filter(sh => t - sh.t0 < sh.life);

    // the camera: the planet grows in at the start, and dives into the chosen thing at the end
    ctx.save();
    if (sceneK !== 1) { ctx.translate(cx, cy); ctx.scale(sceneK, sceneK); ctx.translate(-cx, -cy); ctx.globalAlpha = clamp(t / 1.2, 0, 1); }
    if (leaving && leaving.zoom0 != null) {
      const o = leaving.o, z = 1 + easeIn(clamp((now - leaving.zoom0) / 1400, 0, 1)) * 16, fx = o.ax + (o.tx - o.ax) * 0.72, fy = o.ay + (o.ty - o.ay) * 0.72;
      ctx.translate(fx, fy); ctx.scale(z, z); ctx.translate(-fx, -fy);
    }
    drawDust(t, false);
    if (moon.z < 0) drawMoon(t);
    drawClouds(t, false);
    const order = THINGS.slice().sort((a, b) => a.z - b.z);
    for (const o of order) if (o.z < 0 && o.z > -0.45) drawThing(o, t);
    drawPlanet();
    for (const o of order) if (o.z >= 0) drawThing(o, t);
    drawClouds(t, true);
    drawDust(t, true);
    if (moon.z >= 0) drawMoon(t);
    for (const s of sparks) {
      s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 220 * dt;
      const a = 1 - s.t / s.life; if (a <= 0) continue;
      ctx.fillStyle = `rgba(${s.gold ? "255,222,150" : "255,170,205"},${a})`; ctx.beginPath(); ctx.arc(s.x, s.y, 2.4 * a + 0.6, 0, TAU); ctx.fill();
    }
    sparks = sparks.filter(s => s.t < s.life);
    if (CONFIG.labels && (!leaving || leaving.zoom0 == null)) { for (const o of SECS) label(o, t); }
    for (const o of EGGS) if (o.z > 0) bubble(o, t);
    bubble(moon, t);
    ctx.restore();
    requestAnimationFrame(frame);
  }

  const seek = /t=([\d.]+)/.exec(location.hash); // testing: #t=6 starts 6 seconds in
  if (seek) { born -= +seek[1] * 1000; document.body.classList.add("skip"); }
  build();
  addEventListener("resize", build);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
