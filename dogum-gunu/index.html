<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=MonteCarlo&display=swap" rel="stylesheet">
<style>
/* A bouquet of chrysanthemums on a night-indigo sheet. A camera follows the pen while it draws the last flower;
   once it is in the bouquet the page turns into v3's paper board, then the lights go down and paper fireworks
   open in the night behind it. */
:root { --ink: #0d1325; --night: #1b2747; --gold: #f0bf4c; --board: #e7dfd2; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); }
.app {
  position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(60% 50% at 50% 38%, rgba(84, 108, 176, 0.30), transparent 70%),
    radial-gradient(120% 80% at 50% 115%, #090d1c 0%, transparent 60%),
    linear-gradient(180deg, var(--night) 0%, var(--ink) 100%);
}
.app::after { /* vignette, while the flower is drawn */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(3, 5, 14, 0.55) 100%);
  opacity: var(--drawing, 1);
}
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }
#sky:focus-visible { outline: 2px solid var(--gold); outline-offset: -6px; }
.grain, .light { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
.grain { mix-blend-mode: multiply; background-size: 200px 200px; }
.light { background: radial-gradient(circle at 20% 10%, rgba(255,248,235,0.10), rgba(40,25,10,0.10) 110%); }

/* ---------- the envelope: tap it, it opens, then the drawing starts ---------- */
.envelope-wrap {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; align-content: center; gap: 22px;
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.envelope-wrap.gone { opacity: 0; transform: scale(1.08); pointer-events: none; }
.env {
  --w: min(78vw, 420px);
  position: relative; width: var(--w); height: calc(var(--w) * 0.64);
  perspective: 1100px; cursor: pointer; outline: none;
  animation: env-in 1s cubic-bezier(.2,.8,.2,1) both, env-float 4.5s ease-in-out 1s infinite;
}
.env:focus-visible .env-back { outline: 2px solid var(--gold); outline-offset: 6px; }
.env > * { position: absolute; inset: 0; }
.env-back { /* the inside of the envelope */
  border-radius: 6px; background: linear-gradient(180deg, #d9c9ae, #cdbb9c);
  box-shadow: 0 22px 46px rgba(2, 4, 14, 0.55), 0 4px 10px rgba(2, 4, 14, 0.35);
  z-index: 0;
}
.env-card { /* the card inside */
  inset: 7% 6% 6% 6%; border-radius: 3px; z-index: 2;
  background: linear-gradient(180deg, #fffaf0, #f5ecdc);
  box-shadow: 0 1px 3px rgba(60, 40, 20, 0.25), inset 0 0 0 6px #fffaf0, inset 0 0 0 7px rgba(200, 160, 80, 0.55);
  display: grid; place-items: center;
  transition: transform 0.9s cubic-bezier(.25,.8,.25,1);
}
.env-card svg { width: 22%; opacity: 0.9; }
.env-pocket { /* the front: two side folds and the bottom fold */
  z-index: 3; border-radius: 6px; overflow: hidden;
  clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
  background: linear-gradient(180deg, #f3eadb, #e7dac4);
}
.env-pocket svg { width: 100%; height: 100%; display: block; }
.env-flap {
  height: 58%; z-index: 4; transform-origin: 50% 0; transform-style: preserve-3d;
  transition: transform 0.75s cubic-bezier(.4,0,.2,1) 0.25s;
}
.env-flap > div { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 50% 100%); backface-visibility: hidden; }
.env-flap .out { background: linear-gradient(180deg, #f6eee0, #eadfca); }
.env-flap .out::after { /* a soft shadow line along the flap's edges */
  content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 70%, rgba(80, 55, 25, 0.12));
}
.env-flap .in { /* the lining */
  transform: rotateX(180deg);
  background:
    radial-gradient(circle, rgba(246, 214, 140, 0.55) 1.2px, transparent 1.6px) 0 0 / 14px 14px,
    linear-gradient(0deg, #c97c97, #b86683);
}
.env-seal {
  inset: auto; left: 50%; top: 58%; width: calc(var(--w) * 0.19); aspect-ratio: 1; z-index: 5;
  transform: translate(-50%, -50%); border-radius: 48% 52% 50% 50% / 52% 47% 53% 48%;
  background: radial-gradient(circle at 36% 30%, #9e2f45, #6d1427 55%, #460a18);
  box-shadow: 0 3px 9px rgba(40, 0, 10, 0.45), inset 0 -3px 6px rgba(30, 0, 8, 0.45), inset 0 2px 4px rgba(230, 150, 165, 0.3);
  display: grid; place-items: center;
  transition: transform 0.45s cubic-bezier(.3,1.6,.5,1), opacity 0.45s ease;
}
.env-seal svg { width: 86%; overflow: visible; }
.seal-mono { /* the initials, pressed into the wax in gold */
  font: 400 40px "MonteCarlo", "Cormorant Garamond", cursive;
  fill: #ffffff; filter: drop-shadow(0 1px 0.5px rgba(30, 0, 8, 0.6));
}

/* the security check: a pretend face scan, then the questions */
.gate {
  position: absolute; left: 50%; top: calc(50% + min(78vw, 420px) * 0.32 + 24px);
  width: min(90vw, 460px); transform: translate(-50%, 8px);
  display: grid; justify-items: center; gap: 10px; text-align: center;
  font-family: "Cormorant Garamond", Georgia, serif; color: #f4ead6;
  opacity: 0; visibility: hidden; transition: opacity 0.5s ease, transform 0.5s ease, visibility 0s 0.5s;
}
.envelope-wrap.asking .gate { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity 0.5s ease, transform 0.5s ease; }
.envelope-wrap.open .gate { opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0s 0.4s; }
.gate-title { font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase; font-style: normal; font-weight: 500; color: #e8c57a; }
.gate-lines { display: grid; gap: 2px; min-height: 1.3em; }
.gate-lines:empty { display: none; }
.gate-lines p { margin: 0; font-style: italic; font-weight: 500; font-size: clamp(16px, 4vw, 19px); line-height: 1.3; animation: line-in 0.35s ease both; }
.gate-lines p.err { color: #ff9fb8; }
.gate-lines p.ok, .gate-msg.ok, .yn-msg.ok { color: #b9f0c4; }
@keyframes line-in { from { opacity: 0; transform: translateY(4px); } }
.gate-bar { width: min(70%, 260px); height: 6px; border-radius: 99px; background: rgba(255,255,255,0.12); overflow: hidden; display: none; }
.gate-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #e8c57a, #ff9fb8); }
.gate.scanning .gate-bar { display: block; }
.gate.scanning .gate-bar i { animation: bar-fill 1.8s cubic-bezier(.3,.1,.3,1) forwards; }
@keyframes bar-fill { 70% { width: 88%; } 82% { width: 88%; } to { width: 100%; } }
.gate-quiz { display: none; gap: 10px; justify-items: center; width: 100%; }
.gate.quiz .gate-quiz { display: grid; animation: line-in 0.4s ease both; }
.gate-yn { display: none; gap: 14px; justify-items: center; width: 100%; }
.gate.yn .gate-quiz { display: none; }
.gate.yn .gate-yn { display: grid; animation: line-in 0.4s ease both; }
.yn-row { display: flex; gap: 14px; justify-content: center; align-items: center; min-height: 52px; }
.yn-btn {
  min-width: 96px; padding: 8px 22px; border-radius: 999px; border: 1px solid rgba(232, 197, 122, 0.7);
  background: rgba(232, 197, 122, 0.1); color: #f4ead6; cursor: pointer; touch-action: manipulation;
  font: italic 500 19px "Cormorant Garamond", Georgia, serif;
  transition: transform 0.25s cubic-bezier(.3,1.5,.5,1), background 0.2s;
}
.yn-btn:hover, .yn-btn:focus-visible { background: rgba(232, 197, 122, 0.24); outline: none; }
.yn-yes { background: rgba(232, 197, 122, 0.2); }
.yn-no.loose { /* once it runs, it is free to go anywhere on the screen */
  position: fixed; z-index: 12; margin: 0;
  transition: left 0.28s cubic-bezier(.3,1.3,.5,1), top 0.28s cubic-bezier(.3,1.3,.5,1);
}
.yn-ghost { visibility: hidden; }
.yn-msg { min-height: 1.3em; margin: 0; font-style: italic; font-size: 17px; opacity: 0.85; }
.gate-q { margin: 0; font-style: italic; font-weight: 500; font-size: clamp(19px, 4.6vw, 24px); line-height: 1.25; }
.gate-row { display: flex; gap: 10px; align-items: center; width: min(100%, 320px); }
.gate-in {
  flex: 1; min-width: 0; padding: 8px 4px; border: 0; border-bottom: 1px solid rgba(232, 197, 122, 0.6);
  background: transparent; color: #fff; outline: none; text-align: center;
  font: italic 500 20px "Cormorant Garamond", Georgia, serif;
}
.gate-in::placeholder { color: rgba(244, 234, 214, 0.35); }
.gate-in:focus { border-bottom-color: #e8c57a; }
.gate-go {
  padding: 7px 18px; border-radius: 999px; border: 1px solid rgba(232, 197, 122, 0.7);
  background: rgba(232, 197, 122, 0.1); color: #f4ead6; cursor: pointer;
  font: italic 500 18px "Cormorant Garamond", Georgia, serif;
}
.gate-go:hover, .gate-go:focus-visible { background: rgba(232, 197, 122, 0.22); outline: none; }
.gate-msg { min-height: 1.3em; margin: 0; font-style: italic; font-size: 17px; }
.gate-hint { min-height: 1.2em; margin: 0; font-style: italic; font-size: 15px; color: #e8c57a; opacity: 0.85; }
.gate.wrong .gate-row { animation: gate-shake 0.42s ease; }
@keyframes gate-shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
/* the scan line sweeping the screen */
.scanline {
  position: fixed; left: 0; right: 0; top: 0; height: 3px; z-index: 11; pointer-events: none; opacity: 0;
  background: linear-gradient(90deg, transparent, #ff9fb8 20%, #fff 50%, #ff9fb8 80%, transparent);
  box-shadow: 0 0 18px 4px rgba(255, 159, 184, 0.55);
}
.envelope-wrap.scan .scanline { animation: scan-sweep 1.8s ease-in-out forwards; }
@keyframes scan-sweep { 0% { opacity: 0; top: 4%; } 10% { opacity: 1; } 50% { top: 96%; } 90% { opacity: 1; } 100% { opacity: 0; top: 4%; } }
/* the envelope's moods */
.envelope-wrap.nope .env { animation: env-nope 0.55s ease; }
.envelope-wrap.yay .env { animation: env-yay 0.7s ease; }
@keyframes env-nope { 15% { transform: rotate(-5deg); } 35% { transform: rotate(4deg); } 55% { transform: rotate(-3deg); } 75% { transform: rotate(2deg); } }
@keyframes env-yay { 30% { transform: translateY(-22px) scale(1.04); } 55% { transform: translateY(0) scale(0.98); } 75% { transform: translateY(-8px); } }

/* opening, step by step */
.envelope-wrap.open .env { animation-play-state: paused; }
.envelope-wrap.open .env-seal { transform: translate(-50%, -50%) scale(1.25); opacity: 0; }
.envelope-wrap.open .env-flap { transform: rotateX(180deg); }
.envelope-wrap.flap-back .env-flap { z-index: 1; }
.envelope-wrap.card-out .env-card { transform: translateY(-46%); }
/* the wish cake: rises in the middle once the envelope opens; blow (mic) or tap the candle, then the flower */
.cake-wrap {
  position: fixed; inset: 0; z-index: 14; display: grid; place-items: center; align-content: center; gap: 14px;
  background: radial-gradient(70% 60% at 50% 55%, rgba(10, 14, 32, 0.72), rgba(4, 6, 16, 0.9));
  -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
  font-family: "Cormorant Garamond", Georgia, serif; color: #f4ead6; text-align: center;
  opacity: 0; visibility: hidden; transition: opacity 0.9s ease, visibility 0s 0.9s;
}
.cake-wrap.show { opacity: 1; visibility: visible; transition: opacity 0.9s ease; }
.cake-msg { margin: 0; padding: 0 16px; font-style: italic; font-weight: 500; font-size: clamp(22px, 5.4vw, 32px); line-height: 1.2; min-height: 1.2em; }
.cake-msg.done { color: #ffc4d8; animation: line-in 0.6s ease both; }
.cake {
  width: min(52vw, 230px); cursor: pointer; touch-action: manipulation; border: 0; padding: 0; background: none;
  transform: translateY(40px); opacity: 0; transition: transform 1.1s cubic-bezier(.2,.9,.3,1.1) 0.2s, opacity 0.9s ease 0.2s;
}
.cake-wrap.show .cake { transform: none; opacity: 1; }
.cake:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; border-radius: 12px; }
.cake svg { display: block; width: 100%; height: auto; overflow: visible; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; transform: rotate(var(--lean, 0deg)) scale(var(--gust, 1)); transition: transform 0.12s ease-out; }
.flame-in { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 0.22s ease-in-out infinite alternate; }
@keyframes flicker { from { transform: scale(1, 1) skewX(-2deg); } to { transform: scale(0.94, 1.06) skewX(2deg); } }
.flame-glow { transition: opacity 0.5s ease; }
.cake-wrap.out .flame { transform: rotate(var(--lean, 18deg)) scale(0.05); opacity: 0; transition: transform 0.35s ease-in, opacity 0.35s ease-in; }
.cake-wrap.out .flame-glow { opacity: 0; }
.smoke path { fill: none; stroke: rgba(230, 228, 236, 0.55); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 60; stroke-dashoffset: 60; opacity: 0; }
.cake-wrap.out .smoke path { animation: smoke 2.4s ease-out forwards; }
.cake-wrap.out .smoke path:nth-child(2) { animation-delay: 0.25s; }
.cake-wrap.out .smoke path:nth-child(3) { animation-delay: 0.5s; }
@keyframes smoke { 0% { opacity: 0; stroke-dashoffset: 60; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; stroke-dashoffset: 0; transform: translateY(-26px); } }
/* the way back to the planet: a little planet in the corner, always there */
.home { position: fixed; z-index: 40; left: max(14px, env(safe-area-inset-left) + 10px); top: max(14px, env(safe-area-inset-top) + 10px);
  width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: rgba(10, 14, 32, 0.45);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: 0 0 0 1px rgba(255, 196, 216, 0.25);
  opacity: 0; visibility: hidden; transform: scale(0.8); transition: opacity 1.2s ease, transform 1.2s ease, visibility 0s 1.2s; -webkit-tap-highlight-color: transparent; }
.home.show { opacity: 0.85; visibility: visible; transform: none; transition: opacity 1.2s ease, transform 1.2s ease; }
.home:hover { opacity: 1; }
.home:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.home svg { width: 32px; height: 32px; display: block; overflow: visible; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }
@keyframes env-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes env-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) {
  .env, .gate.wrong .gate-row, .envelope-wrap.nope .env, .envelope-wrap.yay .env { animation: none; }
  .envelope-wrap.scan .scanline { animation-duration: 0.01s; }
  .yn-no.loose { transition-duration: 0.05s; }
  .flame-in, .cake-wrap.out .smoke path { animation: none; }
  .cake { transition-duration: 0.01s; transition-delay: 0s; }
  .env-flap, .env-card, .env-seal, .envelope-wrap { transition-duration: 0.01s; transition-delay: 0s; }
}
</style>
</head>
<body>
<main class="app">
  <canvas id="sky" tabindex="0" aria-label="After the envelope is opened, a pink chrysanthemum is drawn with a glowing gold pen, stem first, then coloured and placed into a finished bouquet. Then the lights go down, paper fireworks burst in the night sky, and the pen writes Doğum günün kutlu olsun under the bouquet. Tap, or press Enter, to watch it again."></canvas>
</main>
<div class="grain" id="grain"></div>
<div class="light"></div>
<div class="envelope-wrap" id="envelope">
  <div class="env" role="button" tabindex="0" aria-label="Zarfı aç">
    <div class="env-back"></div>
    <div class="env-card"><svg viewBox="-50 -50 100 100" aria-hidden="true" class="kiku"></svg></div>
    <div class="env-pocket"><svg viewBox="0 0 100 64" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 0 L50 34.6 L0 64 Z" fill="#efe4d1"/><path d="M100 0 L50 34.6 L100 64 Z" fill="#ece0cb"/>
      <path d="M0 64 L50 31 L100 64 Z" fill="#f4ebdc"/>
      <path d="M0 64 L50 31 L100 64" fill="none" stroke="rgba(120,90,50,0.18)" stroke-width="0.35"/>
    </svg></div>
    <div class="env-flap"><div class="out"></div><div class="in"></div></div>
    <div class="env-seal"><svg viewBox="-50 -50 100 100" aria-hidden="true">
      <text class="seal-mono" y="3" text-anchor="middle" dominant-baseline="middle">B.K.</text>
    </svg></div>
  </div>
  <div class="scanline" aria-hidden="true"></div>
  <form class="gate" autocomplete="off" novalidate>
    <span class="gate-title">Güvenlik kontrolü</span>
    <div class="gate-lines" aria-live="polite"></div>
    <div class="gate-bar" aria-hidden="true"><i></i></div>
    <div class="gate-quiz">
      <label class="gate-q" for="gate-in"></label>
      <div class="gate-row">
        <input class="gate-in" id="gate-in" type="text" placeholder="cevabın…" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="gate-go" type="submit">Aç</button>
      </div>
      <p class="gate-msg" aria-live="polite"></p>
      <p class="gate-hint" aria-live="polite"></p>
    </div>
    <div class="gate-yn">
      <p class="gate-q yn-q"></p>
      <div class="yn-row">
        <button type="button" class="yn-btn yn-yes"></button>
        <button type="button" class="yn-btn yn-no"></button>
      </div>
      <p class="yn-msg" aria-live="polite"></p>
    </div>
  </form>
</div>
<a class="home" id="home" href="../index.html" aria-label="Gezegene dön">
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <ellipse cx="16" cy="16" rx="15" ry="4.5" transform="rotate(-20 16 16)" fill="none" stroke="#f6c64f" stroke-width="1.4" opacity="0.55"/>
    <circle cx="16" cy="16" r="9.5" fill="#f7a3c6"/>
    <path d="M8 12.5c3-1.5 5 1.5 8 .5s4-3.500 7-2.500a9.500 9.500 0 0 0-15 2z" fill="#b48cea"/>
    <path d="M9.500 21c3 1 4.500-2 7.500-1.500s4 2 6.500 0a9.500 9.500 0 0 1-14 1.500z" fill="#b48cea"/>
    <path d="M1.800 21.200A15 4.500 -20 0 0 30.200 10.800" fill="none" stroke="#f6c64f" stroke-width="1.400" stroke-linecap="round"/>
  </svg>
</a>
<div class="cake-wrap" id="cake" aria-hidden="true">
  <p class="cake-msg" aria-live="polite"></p>
  <button class="cake" type="button" aria-label="Mumu üfle">
    <svg viewBox="0 0 200 210" aria-hidden="true">
      <defs>
        <radialGradient id="cg-glow"><stop offset="0" stop-color="#ffd98a" stop-opacity="0.55"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
        <linearGradient id="cg-flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff9a3c"/><stop offset="0.45" stop-color="#ffd36b"/><stop offset="1" stop-color="#fff6d8"/></linearGradient>
        <linearGradient id="cg-body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9dcc6"/><stop offset="0.35" stop-color="#f8efe0"/><stop offset="1" stop-color="#e2d3ba"/></linearGradient>
        <linearGradient id="cg-icing" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f28fb0"/><stop offset="0.4" stop-color="#ffc4d8"/><stop offset="1" stop-color="#ec7fa4"/></linearGradient>
        <linearGradient id="cg-candle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#efe3cf"/><stop offset="0.45" stop-color="#fffaf0"/><stop offset="1" stop-color="#e6d6bc"/></linearGradient>
      </defs>
      <circle class="flame-glow" cx="100" cy="34" r="46" fill="url(#cg-glow)"/>
      <!-- plate -->
      <ellipse cx="100" cy="190" rx="92" ry="14" fill="#c99a3e"/>
      <ellipse cx="100" cy="186" rx="92" ry="13" fill="#f0c766"/>
      <ellipse cx="100" cy="185" rx="80" ry="9" fill="#e9b94f" opacity="0.6"/>
      <!-- cake body -->
      <path d="M30 112 V176 Q100 196 170 176 V112 Z" fill="url(#cg-body)"/>
      <path d="M30 160 Q100 178 170 160" fill="none" stroke="#f0bf4c" stroke-width="2" stroke-dasharray="0.1 9" stroke-linecap="round"/>
      <!-- pink icing with drips -->
      <ellipse cx="100" cy="112" rx="70" ry="15" fill="url(#cg-icing)"/>
      <path d="M30 112 Q30 128 36 128 Q42 128 42 118 Q46 136 53 136 Q60 136 60 122 Q66 130 72 130 Q78 130 80 121 Q86 142 94 142 Q101 142 102 124 Q108 132 114 132 Q120 132 122 122 Q128 138 136 138 Q143 138 144 122 Q150 130 156 130 Q163 130 164 118 Q168 128 170 124 V112 Z" fill="url(#cg-icing)"/>
      <ellipse cx="100" cy="110" rx="66" ry="12" fill="#ffd6e4"/>
      <!-- a little pink kiku on the front -->
      <g transform="translate(100 156)" fill="#f28fb0">
        <ellipse rx="2.6" ry="7.5" cy="-7"/><ellipse rx="2.6" ry="7.5" cy="-7" transform="rotate(30)"/><ellipse rx="2.6" ry="7.5" cy="-7" transform="rotate(60)"/>

      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        add(t, i * GA + (r() - 0.5) * 0.08, (0.18 + 0.82 * Math.pow(t, 0.7)) * (0.93 + r() * 0.1),
            (0.038 + 0.045 * t + r() * 0.01) * Math.pow(1 / density, 0.35));
      }
    } else if (v === "pompon") {
      const N = count(260);
      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        add(t, i * GA + (r() - 0.5) * 0.06, (0.2 + 0.8 * Math.pow(t, 0.5)) * (0.95 + r() * 0.07),
            (0.07 + 0.04 * t) * Math.pow(1 / density, 0.35));
      }
    } else if (v === "spider") {
      const N = count(100);
      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        add(t, i * GA + (r() - 0.5) * 0.1, (0.18 + 0.82 * Math.pow(t, 0.6)) * (0.9 + r() * 0.15), 0.016 + 0.012 * t);
      }
    } else { // single
      const N = 30;
      for (let i = 0; i < N; i++) add(1, (i / N) * Math.PI * 2 + (r() - 0.5) * 0.05, 0.95 + r() * 0.08, 0.09);
    }
    P.sort((a, b) => b.len - a.len); // outer petals first, inner ones drawn on top
    // Pen order: ring by ring from the outside in, sweeping around each ring
    const bands = v === "single" ? 1 : 6, TAU = Math.PI * 2;
    const band = p => Math.min(bands - 1, Math.floor((1 - p.t) * bands));
    const ang = p => ((p.angle % TAU) + TAU) % TAU;
    [...P].sort((a, b) => band(a) - band(b) || (band(a) % 2 ? ang(b) - ang(a) : ang(a) - ang(b)))
      .forEach((p, i) => { p.tr = i; Object.assign(p, samplePetal(v, p)); });
    return P;
  }

  function makeHead(variety, colour, seed, sketchSec, density) {
    const col = COLOURS[colour] || COLOURS.gold;
    const petals = makePetals(variety, rng(seed), col, density);
    const N = petals.length, f = { variety, col, petals, cache: null, cacheKey: "" };
    f.td = 0.4;                                        // seconds the pen spends on one petal
    f.gap = (sketchSec - f.td) / Math.max(1, N - 1);   // the next petal starts after this long
    f.sketchEnd = (N - 1) * f.gap + f.td + (variety === "single" ? 0.7 : 0);
    f.cgap = 1.6 / N; f.cd = 0.8;
    return f; // start, cStart and total are set by the bouquet timeline
  }

  function petalSegs(kind, L, w, curl, bend) {
    let segs;
    if (kind === "spider") segs = [
      ["M", L * 0.05, 0],
      ["C", L * 0.5, 0, L * 0.85, curl * L * 0.02, L * 0.95, curl * L * 0.09],
      ["Q", L * 1.0, curl * L * 0.17, L * 0.89, curl * L * 0.16]
    ];
    else if (kind === "pompon") segs = [
      ["M", 0, 0],
      ["C", L * 0.2, -w * 0.6, L * 0.55, -w * 1.1, L * 0.85, -w * 0.9],
      ["Q", L * 1.02, -w * 0.55, L, 0],
      ["Q", L * 1.02, w * 0.55, L * 0.85, w * 0.9],
      ["C", L * 0.55, w * 1.1, L * 0.2, w * 0.6, 0, 0]
    ];
    else segs = [ // decorative + single: strap petal with a small notched tip
      ["M", 0, 0],
      ["C", L * 0.22, -w * 0.95, L * 0.72, -w * 1.08, L * 0.96, -w * 0.5],
      ["Q", L * 1.0, -w * 0.25, L * 0.955, -w * 0.08],
      ["L", L * 0.92, 0],
      ["Q", L * 1.0, w * 0.25, L * 0.96, w * 0.5],
      ["C", L * 0.72, w * 1.08, L * 0.22, w * 0.95, 0, 0]
    ];
    if (bend && kind !== "spider") { // a gentle sideways curve, stronger toward the tip
      const k = (bend * 0.12) / (L || 1);
      for (const s of segs) for (let i = 1; i < s.length; i += 2) s[i + 1] += k * s[i] * s[i];
    }
    return segs;
  }
  const bendY = (p, L, x) => (p.bend * 0.12 * x * x) / (L || 1);
  function petalPath(c, kind, L, w, p) {
    c.beginPath();
    for (const s of petalSegs(kind, L, w, p.curl, p.bend)) {
      if (s[0] === "M") c.moveTo(s[1], s[2]);
      else if (s[0] === "L") c.lineTo(s[1], s[2]);
      else if (s[0] === "Q") c.quadraticCurveTo(s[1], s[2], s[3], s[4]);
      else c.bezierCurveTo(s[1], s[2], s[3], s[4], s[5], s[6]);
    }
  }
  function samplePetal(kind, p) {
    const pts = [];
    let x = 0, y = 0;
    for (const s of petalSegs(kind, p.len, p.w, p.curl, p.bend)) {
      if (s[0] === "M" || s[0] === "L") { x = s[1]; y = s[2]; pts.push([x, y]); continue; }
      if (s[0] === "Q") sampleQuad([x, y], [s[1], s[2]], [s[3], s[4]], 7, pts);
      else sampleCubic([x, y], [s[1], s[2]], [s[3], s[4]], [s[5], s[6]], 12, pts);
      [x, y] = pts[pts.length - 1];
    }
    const line = withCum(pts);
    return { pts, cum: line.cum, plen: line.len };
  }

  // A finished, painted petal: contact shadow, colour along its length, rounded
  // cross-section, light from the upper left, darker where it tucks into the head
  function paintPetal(c, kind, p, L, w, so) {
    c.save(); c.translate(so[0], so[1]);
    petalPath(c, kind, L, w, p);
    if (kind === "spider") { c.strokeStyle = "rgba(8,4,18,0.25)"; c.lineWidth = Math.max(1, w * 2.6); c.lineCap = "round"; c.stroke(); }
    else { c.fillStyle = "rgba(8,4,18,0.26)"; c.fill(); }
    c.restore();

    const body = c.createLinearGradient(0, 0, L, 0);
    body.addColorStop(0, p.base); body.addColorStop(0.55, p.mid); body.addColorStop(1, p.tip);
    petalPath(c, kind, L, w, p);
    if (kind === "spider") {
      c.lineCap = "round";
      c.strokeStyle = body; c.lineWidth = Math.max(1, w * 2); c.stroke();
      c.strokeStyle = `rgba(255,250,235,${0.12 + 0.12 * Math.max(0, p.lit)})`; c.lineWidth = Math.max(0.5, w * 0.6); c.stroke();
      return;
    }
    c.fillStyle = body; c.fill();

    const cross = c.createLinearGradient(0, -w, 0, w);
    cross.addColorStop(0, "rgba(25,8,20,0.30)");
    cross.addColorStop(0.42, "rgba(255,255,255,0.10)");
    cross.addColorStop(0.58, "rgba(255,255,255,0.10)");
    cross.addColorStop(1, "rgba(25,8,20,0.36)");
    c.fillStyle = cross; c.fill();

    c.fillStyle = p.lit > 0 ? `rgba(255,250,232,${0.16 * p.lit})` : `rgba(12,6,28,${-0.24 * p.lit})`;
    c.fill();

    const occ = c.createLinearGradient(0, 0, L * 0.5, 0);
    occ.addColorStop(0, "rgba(18,6,12,0.5)"); occ.addColorStop(1, "rgba(18,6,12,0)");
    c.fillStyle = occ; c.fill();

    c.strokeStyle = "rgba(45,20,10,0.24)"; c.lineWidth = 0.6; c.stroke();
    if (kind === "pompon") { // spoon-shaped petals catch a light rim at the tip
      c.strokeStyle = `rgba(255,250,235,${0.12 + 0.1 * Math.max(0, p.lit)})`; c.lineWidth = 0.8; c.stroke();
    } else if (L > 10) { // a soft ridge down the middle
      c.beginPath();
      c.moveTo(L * 0.14, bendY(p, L, L * 0.14));
      c.quadraticCurveTo(L * 0.5, bendY(p, L, L * 0.5), L * 0.84, bendY(p, L, L * 0.84));
      c.strokeStyle = `rgba(255,252,240,${0.14 + 0.1 * Math.max(0, p.lit)})`;
      c.lineWidth = Math.max(0.6, w * 0.14); c.lineCap = "round"; c.stroke();
    }
  }

  // The pen traces every petal outline, then colour flows in from base to tip, petal by petal.
  // Returns where the pen is (in the caller's coordinates), or null.
  function drawHead(c, f, age, x, y, R, showNib = true) {
    if (age <= 0) return null;
    c.save();
    c.translate(x, y);
    const lw = lineW(R);
    c.lineCap = "round"; c.lineJoin = "round";

    const ks = clamp((age - f.cStart) / 1.4, 0, 1); // soft shadow the head casts on what is behind it
    if (ks > 0) {
      const s = R * 1.12 * easeOut(ks) + 1;
      const g = c.createRadialGradient(R * 0.08, R * 0.12, R * 0.3, R * 0.08, R * 0.12, s);
      g.addColorStop(0, "rgba(3,5,15,0.36)");
      g.addColorStop(1, "rgba(3,5,15,0)");
      c.fillStyle = g;
      c.beginPath(); c.arc(R * 0.08, R * 0.12, s, 0, Math.PI * 2); c.fill();
    }

    const dx = R * 0.016, dy = R * 0.028; // petal shadow offset, down and to the right
    let nib = null, nibTr = -1;
    for (const p of f.petals) {
      const k = clamp((age - p.tr * f.gap) / f.td, 0, 1);
      if (!k) continue;
      const a = easeOut(clamp((age - f.cStart - p.tr * f.cgap) / f.cd, 0, 1));
      const L = R * p.len, w = R * p.w;
      c.save();
      c.rotate(p.angle);
      if (k < 1) {
        const scaled = { pts: p.pts.map(([u, v]) => [u * R, v * R]), cum: p.cum.map(d => d * R) };
        const [ex, ey] = traceTo(c, scaled, easeOut(k) * p.plen * R);
        inkStroke(c, lw * 1.3, true);
        if (p.tr > nibTr) { nibTr = p.tr; nib = [ex * p.cosA - ey * p.sinA, ex * p.sinA + ey * p.cosA]; }
      } else {
        if (a < 1) {
          petalPath(c, f.variety, L, w, p);
          if (f.variety !== "spider") { c.fillStyle = WASH; c.fill(); }
          c.strokeStyle = INK(0.85 * (1 - a)); c.lineWidth = lw; c.stroke();
        }
        if (a > 0) {
          c.save();
          if (a < 1) { c.beginPath(); c.rect(-R * 0.05, -L - R * 0.1, (L * 1.1 + R * 0.05) * a, 2 * L + R * 0.2); c.clip(); }
          paintPetal(c, f.variety, p, L, w, [dx * p.cosA + dy * p.sinA, -dx * p.sinA + dy * p.cosA]);
          c.restore();
        }
      }
      c.restore();
    }

    const e = easeOut(clamp((age - f.cStart - 1.2) / 1, 0, 1));
    if (f.variety === "single") { // golden disc of tiny florets
      if (e > 0) {
        const dg = c.createRadialGradient(-R * 0.05, -R * 0.06, 0, 0, 0, R * 0.23);
        dg.addColorStop(0, "hsl(52 70% 40%)"); dg.addColorStop(1, "hsl(36 70% 16%)");
        c.globalAlpha = e;
        c.fillStyle = "rgba(3,5,15,0.4)"; c.beginPath(); c.arc(R * 0.02, R * 0.03, R * 0.235, 0, Math.PI * 2); c.fill();
        c.fillStyle = dg; c.beginPath(); c.arc(0, 0, R * 0.22, 0, Math.PI * 2); c.fill();
        const n = 120;
        for (let i = 0; i < n; i++) {
          const q = i / n, rr = R * 0.2 * Math.sqrt((i + 0.5) / n), an = i * GA;
          const fx = Math.cos(an) * rr, fy = Math.sin(an) * rr, lit = 1 - (fx + fy) / (R * 0.4);
          c.fillStyle = hsl(72 - 30 * q, 72, clamp(26 + 26 * q + 8 * lit, 10, 80));
          c.beginPath(); c.arc(fx, fy, R * 0.018, 0, Math.PI * 2); c.fill();
        }
        c.globalAlpha = 1;
      }
      const sketched = f.sketchEnd - 0.7;
      if (age < f.cStart + 1) { // the pen circles the centre before colour arrives
        const k = easeOut(clamp((age - sketched) / 0.6, 0, 1));
        const fade = 1 - clamp((age - f.cStart) / 1, 0, 1);
        if (k > 0) {
          c.beginPath(); c.arc(0, 0, R * 0.21, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2);
          c.strokeStyle = INK(0.9 * fade); c.lineWidth = lw; c.stroke();
          if (k < 1) { const an = -Math.PI / 2 + k * Math.PI * 2; nib = [Math.cos(an) * R * 0.21, Math.sin(an) * R * 0.21]; }
        }
      }
    } else if (e > 0 && f.variety !== "spider") { // tightly curled, unopened petals in the very centre
      const [h, s, l] = f.col.base;
      c.globalAlpha = e;
      const cg = c.createRadialGradient(-R * 0.02, -R * 0.03, 0, 0, 0, R * 0.08);
      cg.addColorStop(0, hsl(h + 10, s, l + 18)); cg.addColorStop(1, hsl(h - 4, s, l - 12));
      c.fillStyle = cg; c.beginPath(); c.arc(0, 0, R * 0.075, 0, Math.PI * 2); c.fill();
      for (let i = 0; i < 22; i++) {
        const an = i * GA, rr = R * 0.062 * Math.sqrt((i + 0.5) / 22);
        c.beginPath(); c.arc(Math.cos(an) * rr, Math.sin(an) * rr, R * 0.016, an + 0.6, an + 0.6 + Math.PI * 1.3);
        c.strokeStyle = hsl(f.col.tip[0], f.col.tip[1], f.col.tip[2] - 8, 0.8);
        c.lineWidth = Math.max(0.6, R * 0.006); c.stroke();
      }
      c.globalAlpha = 1;
    }
    if (nib && showNib) drawNib(c, nib[0], nib[1]);
    c.restore();
    return nib ? [x + nib[0], y + nib[1]] : null;
  }

  // Once a head is finished, draw it once into its own canvas (a little sharper than needed) and reuse that
  function headImage(f, R) {
    const q = DPR * 1.5, key = R + "@" + q;
    if (f.cache && f.cacheKey === key) return f.cache;
    const S = Math.ceil(R * 2.6 * q);
    const oc = document.createElement("canvas");
    oc.width = oc.height = S;
    const o = oc.getContext("2d");
    o.setTransform(q, 0, 0, q, 0, 0);
    drawHead(o, f, Infinity, R * 1.3, R * 1.3, R, false);
    f.cache = oc; f.cacheKey = key;
    return oc;
  }

  // ---------- leaves ----------
  // Chrysanthemum leaf: deeply lobed with small teeth along the edge; the two sides differ a little
  function leafHalfWidth(s, phase) {
    const lobes = 0.52 + 0.48 * Math.pow(Math.abs(Math.cos(3 * Math.PI * s + phase)), 0.6);
    const teeth = 1 + 0.08 * ((s * 17 + phase * 3) % 1);
    return 0.31 * Math.pow(Math.sin(Math.PI * s), 0.75) * lobes * teeth;
  }
  const LEAF = (() => {
    const top = [], bot = [], n = 70;
    for (let i = 0; i <= n; i++) {
      const s = i / n;
      top.push([s, -leafHalfWidth(s, 0)]);
      bot.push([s, leafHalfWidth(s, 0.35)]);
    }
    return { outline: [...top, ...bot.reverse().slice(1)], top };
  })();

  function leafFrame(lf, stem, i, U) {
    const [ax, ay] = stem.pts[i], a0 = stem.pts[i - 1], a1 = stem.pts[i + 1];
    const ang = Math.atan2(a1[1] - a0[1], a1[0] - a0[0]) + lf.side * lf.tilt;
    const Lp = U * lf.len, cs = Math.cos(ang), sn = Math.sin(ang);
    const map = ([u, v]) => { v *= lf.side; return [ax + (u * cs - v * sn) * Lp, ay + (u * sn + v * cs) * Lp]; };
    return {
      map, Lp,
      outline: withCum(LEAF.outline.map(map)),
      vein: withCum([[0.03, 0], [0.5, 0], [0.93, 0]].map(map)),
      from: [ax, ay], tip: map([1, 0])
    };
  }

  function paintLeaf(c, F, g) {
    const { map } = F, s0 = F.Lp * 0.06;
    c.save();
    if (g < 1) { // green flows from the stem out to the tip
      polyPath(c, [map([-0.05, -0.6]), map([g * 1.08, -0.6]), map([g * 1.08, 0.6]), map([-0.05, 0.6])], true);
      c.clip();
    }
    c.save(); c.translate(s0 * 0.5, s0);
    polyPath(c, F.outline.pts, true); c.fillStyle = "rgba(3,6,14,0.35)"; c.fill();
    c.restore();

    polyPath(c, F.outline.pts, true);
    const gr = c.createLinearGradient(F.from[0], F.from[1], F.tip[0], F.tip[1]);
    gr.addColorStop(0, "hsl(112 40% 15%)"); gr.addColorStop(0.6, "hsl(100 42% 27%)"); gr.addColorStop(1, "hsl(92 45% 34%)");
    c.fillStyle = gr; c.fill();
    c.strokeStyle = "rgba(4,18,6,0.55)"; c.lineWidth = 0.8; c.stroke();

    const half = LEAF.top.map(map).concat([map([1, 0]), map([0, 0])]); // one half turned slightly away from the light
    polyPath(c, half, true); c.fillStyle = "rgba(0,14,6,0.3)"; c.fill();

    c.lineCap = "round";
    for (const s of [0.16, 0.32, 0.48, 0.64, 0.8]) { // side veins
      for (const side of [-1, 1]) {
        const s2 = Math.min(0.95, s + 0.11), hw = leafHalfWidth(s2, side < 0 ? 0 : 0.35) * 0.72 * side;
        const a = map([s, 0]), b = map([s2, hw]);
        c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
        c.strokeStyle = "rgba(200,232,160,0.22)"; c.lineWidth = 0.7; c.stroke();
      }
    }
    traceTo(c, F.vein, F.vein.len);
    c.strokeStyle = "rgba(205,236,165,0.5)"; c.lineWidth = Math.max(0.8, F.Lp * 0.012); c.stroke();
    c.restore();
  }

  // ---------- the bouquet: timeline ----------
  function newBouquet(delayMs = 300) {
    const seed = (Math.random() * 2 ** 32) >>> 0, r = rng(seed ^ 0x9e3779b9);
    const list = CONFIG.flowers.slice(0, SLOTS.length), lastI = list.length - 1;
    const flowers = list.map((fl, i) => {
      const big = i === lastI, own = big;
      const head = makeHead(fl.variety, fl.colour, (seed + i * 7919) >>> 0, big ? 2.8 : own ? 2.6 : 1.8, big || own ? 1 : 0.6);
      return { head, stemStart: -100, stemDur: STEM_T };
    });
    // The bouquet is already finished, out of sight; only the last flower is drawn.
    const C = -60;
    flowers.forEach((o, i) => {
      if (i === lastI) return;
      const h = o.head;
      h.start = -90; h.cStart = C - h.start; h.total = h.cStart + 1.6 + h.cd + 0.8;
    });
    const leaves = LEAF_PLAN.filter(l => l.stem < lastI).map(l => ({ ...l, len: 0.22 + r() * 0.06, tilt: 0.95 + r() * 0.3, start: -80 }));
    const back = { start: -70 }, wrap = { start: -70 }, ribbon = { start: -70 };
    // the last flower: the stem from its cut end upward, then every petal, then colour
    const own = flowers[lastI], h = own.head;
    own.stemStart = 0.5; own.stemDur = 1.4;
    h.start = own.stemStart + own.stemDur + 0.1;
    h.cStart = h.sketchEnd + 0.3; h.total = h.cStart + 1.6 + h.cd + 0.8;
    const green0 = h.start + h.sketchEnd + 0.1;
    const move0 = h.start + h.cStart + 1.6 + h.cd + 0.4, moveDur = 2.6;   // then it is carried into the bouquet
    const total = move0 + moveDur + 1.2;
    const born = reduced ? performance.now() - (total / speed) * 1000 - 1 : performance.now() + delayMs;
    bouquet = { flowers, leaves, back, wrap, ribbon, C, total, born, lastI, green0, move0, moveDur };
    geom = null;
    lastNib = null;
  }
  const ageOf = now => ((now - bouquet.born) / 1000) * speed;

  // ---------- the bouquet: shapes (rebuilt when the screen size changes) ----------
  function getGeom() {
    if (geom && geom.W === W && geom.H === H) return geom;
    const U = Math.min(W * 1.0, H * 0.56), cx = W / 2, cy = Math.max(H * 0.34, U * 0.72 + 12); // room above for the big flower on top
    const wT = cy + U * 0.33, wB = cy + U * 0.95, bindY = cy + U * 0.76, endY = cy + U * 1.12;
    const ribY = bindY - RIB_UP * U; // where the ribbon is tied: a little above where the stems gather
    const B = bouquet;

    const heads = B.flowers.map((_, i) => ({ x: cx + SLOTS[i][0] * U, y: cy + SLOTS[i][1] * U, R: SLOTS[i][2] * U }));

    // stems: from the cut end at the bottom, through the tie, up to the head
    const stems = heads.map(h => {
      const sp = clamp((h.x - cx) / (0.4 * U), -1, 1);
      const end = [cx + sp * 0.075 * U, endY], bind = [cx + sp * 0.022 * U, bindY];
      const ctrl = [bind[0] + (h.x - bind[0]) * 0.15, h.y + (bind[1] - h.y) * 0.55];
      const pts = [end];
      sampleLine(end, bind, 8, pts);
      sampleQuad(bind, ctrl, [h.x, h.y + h.R * 0.05], 34, pts);
      return withCum(pts);
    });

    const leaves = B.leaves.map(lf => {
      const st = stems[lf.stem], target = wT - U * lf.up;
      let best = 10, bd = Infinity;
      for (let i = 10; i < st.pts.length - 1; i++) { const d = Math.abs(st.pts[i][1] - target); if (d < bd) { bd = d; best = i; } }
      return leafFrame(lf, st, best, U);
    });

    // paper behind the flowers, with three points showing above them
    const backCorners = [
      [cx - 0.4 * U, wT], [cx - 0.64 * U, cy - 0.12 * U], [cx - 0.3 * U, cy - 0.2 * U], [cx - 0.06 * U, cy - 0.52 * U],
      [cx + 0.18 * U, cy - 0.3 * U], [cx + 0.6 * U, cy - 0.27 * U], [cx + 0.4 * U, wT]
    ];
    const backPts = [backCorners[0]];
    for (let i = 1; i < backCorners.length; i++) sampleLine(backCorners[i - 1], backCorners[i], 10, backPts);
    sampleLine(backCorners[backCorners.length - 1], backCorners[0], 10, backPts);
    const back = withCum(backPts);

    // front wrap: a paper cone with a soft wavy top edge and two folds
    const hw = 0.44 * U, bw = 0.07 * U;

  // ---------- painting the paper and ribbon ----------

    polyPath(ctx, pts, true);
    const g = ctx.createLinearGradient(0, G.cy - 0.52 * G.U, 0, G.wT);
    g.addColorStop(0, P.back[0]); g.addColorStop(1, P.back[1]);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "rgba(60,40,20,0.35)"; ctx.lineWidth = 0.8; ctx.stroke();

      ctx.beginPath(); ctx.moveTo(tip[0], tip[1]); ctx.lineTo(G.cx + (tip[0] - G.cx) * 0.2, G.wT);
      ctx.strokeStyle = "rgba(255,250,240,0.35)"; ctx.lineWidth = 1.2; ctx.stroke();

    polyPath(ctx, w.outline.pts, true); ctx.fillStyle = "rgba(3,5,14,0.4)"; ctx.fill();
    ctx.restore();

    polyPath(ctx, w.rightPanel, true); ctx.fillStyle = "rgba(30,15,5,0.12)"; ctx.fill();

    }

        } else {

  // ---------- drawing the whole bouquet at this moment; returns where the pen is ----------
  function drawBouquet(now) {
    const B = bouquet, G = getGeom(), age = ageOf(now);
    if (age <= 0) return null;
    const U = G.U, lw = Math.max(0.8, U * 0.0032), C = B.C;
    const prog = (s, d) => easeInOut(clamp((age - s) / d, 0, 1));
    const gGreenAll = prog(C, 1.2), aBack = prog(C + 0.3, 1.0), aWrap = prog(C + 0.5, 1.2), aRib = prog(C + 1.2, 0.8);

    const glow = prog(C + 0.6, 2.5); // a faint light behind the flowers once they have colour
    if (glow > 0) {
      const hg = ctx.createRadialGradient(G.cx, G.cy, U * 0.1, G.cx, G.cy, U * 1.1);
      hg.addColorStop(0, `rgba(236,238,244,${0.025 * glow})`); hg.addColorStop(1, "rgba(236,238,244,0)"); // faint neutral light

    if (aBack > 0) for (const lf of G.bed) { // packed foliage
      polyPath(ctx, lf.pts, true);

      ctx.strokeStyle = "rgba(2,12,4,0.6)"; ctx.lineWidth = 0.8; ctx.stroke();

  // ---------- camera: close on the pen while it draws, then pulls back to the whole bouquet ----------
  // the last shot: the whole bouquet high up, the words written underneath
  function finaleLayout() {

    ctx.font = NICK_FONT(size);
    const gx = ctx.textAlign === "left" ? x : x - w100 * size / 200, g = ctx.createLinearGradient(gx, 0, gx + w100 * size / 100, 0);
    g.addColorStop(0, "#ff8fb6"); g.addColorStop(0.5, "#ffc4d8"); g.addColorStop(1, "#ff7aa8");
    ctx.fillStyle = g; ctx.fillText(text, x, y + rise);
    ctx.restore();
  }

  // ---------- the wish cake: blow into the mic (or tap) to put the candle out, then confetti ----------
  const CAKE = CONFIG.cake && CONFIG.cake.wish ? CONFIG.cake : null;
  const cakeWrap = document.getElementById("cake"), cakeBtn = cakeWrap.querySelector(".cake"), cakeMsg = cakeWrap.querySelector(".cake-msg");
  const flameEl = cakeWrap.querySelector(".flame"), confCv = document.getElementById("confetti"), confCtx = confCv.getContext("2d");
  let cakeLit = false, mic = null, afterCake = null;
  function showCake(then) {
    cakeLit = true; afterCake = then;
    cakeWrap.classList.remove("out"); flameEl.style.removeProperty("--lean"); flameEl.style.removeProperty("--gust");
    cakeMsg.classList.remove("done"); cakeMsg.textContent = CAKE.wish;
    cakeWrap.setAttribute("aria-hidden", "false"); cakeWrap.classList.add("show");
    if (CAKE.mic !== false) listen();
  }
  function stopMic() {
    if (!mic) return;
    try { mic.stream.getTracks().forEach(t => t.stop()); mic.ac.close(); } catch (e) {}
    mic = null;
  }
  async function listen() { // a blow is loud, steady noise: the flame bends with it, and goes out if it lasts
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      if (!cakeLit) { stream.getTracks().forEach(t => t.stop()); return; }
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume().catch(() => {});
      const an = ac.createAnalyser(); an.fftSize = 1024;
      ac.createMediaStreamSource(stream).connect(an);
      mic = { stream, ac };
      const buf = new Float32Array(an.fftSize);
      let held = 0, lv = 0, t0 = performance.now();
      const tick = now => {
        if (!mic || !cakeLit) return;
        const dt = Math.min(0.1, (now - t0) / 1000); t0 = now;
        an.getFloatTimeDomainData(buf);
        let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
        const rms = Math.sqrt(s / buf.length);
        lv += (rms - lv) * 0.35;
        const k = clamp((lv - 0.02) / 0.12, 0, 1);
        flameEl.style.setProperty("--lean", (k * 38).toFixed(1) + "deg");
        flameEl.style.setProperty("--gust", (1 - k * 0.35).toFixed(3));
        held = lv > 0.09 ? held + dt : Math.max(0, held - dt * 1.5);
        if (held > 0.45) { blowOut(); return; }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    } catch (e) {} // no mic, or no permission: tapping still works
  }
  async function blowOut() {
    if (!cakeLit) return;
    cakeLit = false; stopMic();
    if (!flameEl.style.getPropertyValue("--lean") || parseFloat(flameEl.style.getPropertyValue("--lean")) < 10) flameEl.style.setProperty("--lean", "22deg");
    cakeWrap.classList.add("out");
    await wait(700);
    cakeMsg.textContent = CAKE.done; cakeMsg.classList.add("done");
    confetti();
    await wait(4200);
    cakeWrap.classList.remove("show"); cakeWrap.setAttribute("aria-hidden", "true");
    canvas.focus({ preventScroll: true });
    const then = afterCake; afterCake = null;
    if (then) then();
  }
  cakeBtn.addEventListener("click", blowOut);
  function confetti() { // paper pieces: a burst from the cake, then a slow fall
    const w = innerWidth, h = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
    confCv.width = Math.round(w * dpr); confCv.height = Math.round(h * dpr);
    const inks = ["#ff8fb6", "#ffc4d8", "#e86a92", "#f0bf4c", "#f6d58c", "#fff4dc"];
    const r = cakeBtn.getBoundingClientRect(), ox = r.left + r.width / 2, oy = r.top + r.height * 0.35;
    const n = reduced ? 40 : 170, P = [];
    for (let i = 0; i < n; i++) {
      const top = i % 3 === 0, a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, v = 380 + Math.random() * 520;
      P.push({
        x: top ? Math.random() * w : ox, y: top ? -20 - Math.random() * h * 0.5 : oy,
        vx: top ? (Math.random() - 0.5) * 60 : Math.cos(a) * v, vy: top ? 40 + Math.random() * 80 : Math.sin(a) * v,
        s: 5 + Math.random() * 7, rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 9, ph: Math.random() * 6.3,
        col: inks[i % inks.length], round: Math.random() < 0.25,
      });
    }
    let t0 = performance.now(), age = 0;
    const step = now => {
      const dt = Math.min(0.05, (now - t0) / 1000); t0 = now; age += dt;
      confCtx.setTransform(dpr, 0, 0, dpr, 0, 0); confCtx.clearRect(0, 0, w, h);
      let alive = 0;
      for (const p of P) {
        p.vy += 520 * dt; p.vx *= 1 - 1.6 * dt; p.vy *= 1 - 1.6 * dt; // gravity, then air holds the paper back
        p.x += (p.vx + Math.sin(age * 3 + p.ph) * 40) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        if (p.y > h + 20) continue;
        alive++;
        confCtx.save(); confCtx.translate(p.x, p.y); confCtx.rotate(p.rot); confCtx.scale(1, Math.cos(age * 6 + p.ph)); // the flutter
        confCtx.globalAlpha = clamp(5.6 - age, 0, 1); confCtx.fillStyle = p.col;
        if (p.round) { confCtx.beginPath(); confCtx.arc(0, 0, p.s * 0.45, 0, Math.PI * 2); confCtx.fill(); }
        else confCtx.fillRect(-p.s / 2, -p.s * 0.3, p.s, p.s * 0.6);
        confCtx.restore();
      }
      if (alive && age < 5.6) requestAnimationFrame(step); else confCtx.clearRect(0, 0, w, h);
    };
    requestAnimationFrame(step);
  }

  // ---------- layout + loop ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    makeBackdrop();
  }

  let last = performance.now(), shownPaper = -1;
  const homeEl = CONFIG.home && CONFIG.home.href ? document.getElementById("home") : null;
  if (homeEl) { homeEl.href = CONFIG.home.href; homeEl.classList.add("show"); }
  const grainEl = document.getElementById("grain"), lightEl = document.querySelector(".light");
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    updateCamera(dt, now);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const age = bouquet ? ageOf(now) : 0, pk = bouquet ? paperK(age) : 0, nk = bouquet ? nightK(age) : 0;
    ctx.clearRect(0, 0, W, H);
    if (pk < 1) { ctx.globalAlpha = 1 - pk; drawBackdrop(now); ctx.globalAlpha = 1; } // the original night sheet
    if (pk > 0) { // v3's night fades in over it
      ctx.globalAlpha = pk;
      ctx.fillStyle = `rgb(${NIGHT3.join(",")})`; // v3's night, faded in over the old sky (no cream stage)
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    if (pk !== shownPaper) { // the paper grain and light layers, and the old vignette, follow along
      shownPaper = pk;
      grainEl.style.opacity = lightEl.style.opacity = pk;
      document.documentElement.style.setProperty("--drawing", 1 - pk);
    }
    if (nk > 0) drawNight(age, now);
    if (bouquet) {
      ctx.save();
      ctx.translate(W / 2, H / 2);   // camera: zoom around the point it is looking at
      ctx.scale(cam.z, cam.z);
      ctx.translate(-cam.x, -cam.y);
      lastNib = drawBouquet(now) || lastNib;
      ctx.restore();
    }
    if (pk < 1) { ctx.globalAlpha = 1 - pk; ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    if (bouquet) { drawMessage(age); drawNicknames(age); }
    requestAnimationFrame(frame);
  }

  // Tap or Enter once it is finished: draw it again
  let opened = false;
  function replay() {
    if (!opened) return;
    if (bouquet && ageOf(performance.now()) < bouquet.total) return;
    newBouquet(400);
  }
  canvas.addEventListener("pointerdown", replay);
  canvas.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    replay();
  });

  resize();
  window.addEventListener("resize", resize);

  // ---------- the envelope: the drawing starts once it is opened ----------
  const envWrap = document.getElementById("envelope"), envEl = envWrap.querySelector(".env");
  for (const svg of envWrap.querySelectorAll("svg.kiku")) { // a small gold chrysanthemum, for the card
    let d = "";
    for (let i = 0; i < 16; i++) d += `<ellipse cx="0" cy="-26" rx="6.5" ry="19" transform="rotate(${i * 22.5})"/>`;
    for (let i = 0; i < 12; i++) d += `<ellipse cx="0" cy="-15" rx="4.5" ry="11" transform="rotate(${i * 30 + 15})" opacity="0.85"/>`;
    svg.innerHTML = `<g fill="#f4a3bf" stroke="rgba(150,40,80,0.35)" stroke-width="1">${d}</g><circle r="8" fill="#fbd0de" stroke="rgba(150,40,80,0.4)" stroke-width="1"/>`;
  }
  function openEnvelope() {
    if (opened) return;
    opened = true;
    const k = reduced ? 0.05 : 1, later = (ms, fn) => setTimeout(fn, ms * k);
    envWrap.classList.add("open");                                 // the seal lets go, the flap swings up
    later(620, () => envWrap.classList.add("flap-back"));           // the open flap goes behind the card
    later(950, () => envWrap.classList.add("card-out"));            // the card slides out
    later(1900, () => { // the cake first, then the drawing begins
      envWrap.classList.add("gone");
      if (CAKE) showCake(() => newBouquet(900)); else { newBouquet(500); canvas.focus({ preventScroll: true }); }
    });
    later(2800, () => envWrap.remove());
  }
  // the security check: a pretend face scan, then the questions; the envelope only opens once every answer is right
  // only one question per visit, picked at random (and not the same one as last time)
  const POOL = (Array.isArray(CONFIG.questions) ? CONFIG.questions : []).filter(x => x && x.q && x.a && [].concat(x.a).length);
  let pick = Math.floor(Math.random() * POOL.length), lastQ = -1;
  try { lastQ = +(localStorage.getItem("kiku-last-q") ?? -1); } catch (e) {}
  if (POOL.length > 1 && pick === lastQ) pick = (pick + 1 + Math.floor(Math.random() * (POOL.length - 1))) % POOL.length;
  const forceQ = /q=(\d+)/.exec(location.hash); // testing: #q=5 always asks question 5 (1-based)
  if (forceQ && +forceQ[1] >= 1 && +forceQ[1] <= POOL.length) pick = +forceQ[1] - 1;
  try { localStorage.setItem("kiku-last-q", pick); } catch (e) {}
  const QS = POOL.length ? [POOL[pick]] : [];
  const gate = envWrap.querySelector(".gate"), gateIn = gate.querySelector(".gate-in"), gateLines = gate.querySelector(".gate-lines");
  const gateMsg = gate.querySelector(".gate-msg"), gateHint = gate.querySelector(".gate-hint");
  const norm = t => String(t).toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/ı/g, "i").replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
  const NOPE = ["Yanlış! Sistem kaşlarını çattı", "Hmm… Beniz bunu duysa küserdi", "Sahte Beniz alarmı!",
                "Zarf sabırsızlanıyor", "Ciddi misin?", "Bilgisayar gülmemek için kendini zor tutuyor"];
  const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 150) : ms));
  const line = (t, cls) => { const p = document.createElement("p"); p.textContent = t; if (cls) p.className = cls; gateLines.append(p); };
  const mood = m => { envWrap.classList.remove("nope", "yay"); void envEl.offsetWidth; envWrap.classList.add(m); };
  let qi = 0, wrongs = 0, nopeI = 0, started = false, busy = false;
  function showQuestion() {
    gateLines.textContent = "";
    if (QS.length > 1) line(`Soru ${qi + 1} / ${QS.length}`);
    gate.querySelector(".gate-q").textContent = QS[qi].q;
    gateIn.value = ""; gateMsg.textContent = ""; gateMsg.className = "gate-msg"; gateHint.textContent = ""; wrongs = 0;
  }
  async function ask() {
    if (opened) return;
    if (!QS.length) return openEnvelope();
    if (started) { if (gate.classList.contains("quiz")) gateIn.focus({ preventScroll: true }); return; }
    started = true;
    envWrap.classList.add("asking");
    line("Bu mektup yalnızca Beniz'e özeldir.");
    await wait(900);
    line("Yüz taranıyor…");
    gate.classList.add("scanning"); envWrap.classList.add("scan");
    await wait(1900);
    gate.classList.remove("scanning"); envWrap.classList.remove("scan");
    line("Hata: Güzellik seviyesi ölçüm sınırını aştı.", "err");
    mood("nope");
    await wait(1700);
    line("Yedek doğrulama başlatılıyor…");
    await wait(1200);
    showQuestion();
    gate.classList.add("quiz");
    gateIn.focus({ preventScroll: true });
  }
  gate.addEventListener("submit", async e => {
    e.preventDefault();
    if (opened || busy) return;
    const Q = QS[qi], said = norm(gateIn.value);
    gate.classList.remove("wrong");
    if (!said) { gateMsg.textContent = "Boş cevap kabul edilmez, hanımefendi"; gateMsg.className = "gate-msg"; return gateIn.focus(); }
    if ([].concat(Q.a).some(x => norm(x) === said) || [].concat(Q.contains || []).some(x => said.includes(norm(x)))) {
      busy = true; gateIn.blur();
      gateMsg.className = "gate-msg ok"; gateHint.textContent = "";
      mood("yay");
      if (++qi < QS.length) { gateMsg.textContent = "Doğru! Bir soru daha"; await wait(1300); showQuestion(); busy = false; gateIn.focus(); return; }
      gateMsg.textContent = "Doğru!";
      await wait(1100);
      if (YN) return showYesNo();
      return finish(gateMsg);
    }
    wrongs++;
    const replies = Q.replies || {}, key = Object.keys(replies).find(k => norm(k) === said);
    gateMsg.textContent = key ? replies[key] : NOPE[nopeI++ % NOPE.length];
    gateMsg.className = "gate-msg";
    const hints = Q.hints || {}, hk = Object.keys(hints).map(Number).filter(n => n <= wrongs).sort((a, b) => b - a)[0];
    if (hk) gateHint.textContent = hints[hk];
    void gate.offsetWidth; gate.classList.add("wrong");
    mood("nope");
    gateIn.select();
  });
  async function finish(el) {
    el.className = el.className.replace(/ ok/g, "") + " ok";
    el.textContent = "Kimlik doğrulandı";
    await wait(1000);
    el.textContent = "Hoş geldin, kürk prensesi";
    await wait(1500);
    openEnvelope();
  }

  // the yes / no question: "no" can never be pressed, it always runs away
  const YN = CONFIG.yesno && CONFIG.yesno.q ? CONFIG.yesno : null;
  const ynYes = gate.querySelector(".yn-yes"), ynNo = gate.querySelector(".yn-no"), ynMsg = gate.querySelector(".yn-msg");
  let runs = 0, loose = false, ynDone = false;
  function showYesNo() {
    gate.querySelector(".yn-q").textContent = YN.q;
    ynYes.textContent = YN.yes || "Evet"; ynNo.textContent = YN.no || "Hayır";
    gate.classList.remove("quiz"); gate.classList.add("yn");
    ynYes.focus({ preventScroll: true });
  }
  function flee(px, py) {
    if (ynDone) return;
    if (!loose) { // leave a hidden twin behind so "Evet" doesn't shift, then let it loose on the page
      const r = ynNo.getBoundingClientRect(), ghost = ynNo.cloneNode(true);
      ghost.className = "yn-btn yn-ghost"; ghost.tabIndex = -1; ghost.setAttribute("aria-hidden", "true");
      ynNo.after(ghost);
      Object.assign(ynNo.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px" });
      document.body.append(ynNo); ynNo.classList.add("loose"); void ynNo.offsetWidth;
      loose = true;
    }
    const W = innerWidth, H = innerHeight, bw = ynNo.offsetWidth, bh = ynNo.offsetHeight, m = 14;
    const y = ynYes.getBoundingClientRect(), cur = ynNo.getBoundingClientRect();
    if (px == null) { px = cur.left + bw / 2; py = cur.top + bh / 2; }
    let best = null, bestD = -1;
    for (let i = 0; i < 30; i++) { // somewhere far from the finger, not on top of "Evet"
      const x = m + Math.random() * (W - bw - 2 * m), t = m + Math.random() * (H - bh - 2 * m);
      if (x < y.right + 12 && x + bw > y.left - 12 && t < y.bottom + 12 && t + bh > y.top - 12) continue;
      const d = Math.hypot(x + bw / 2 - px, t + bh / 2 - py);
      if (d > bestD) { best = [x, t]; bestD = d; }
      if (d > Math.min(W, H) * 0.45) break;
    }
    if (best) { ynNo.style.left = best[0] + "px"; ynNo.style.top = best[1] + "px"; }
    runs++;
    ynYes.style.transform = `scale(${1 + Math.min(runs, 8) * 0.06})`; // and "Evet" gets a little bigger every time
  }
  const fleeEv = e => { e.preventDefault(); e.stopPropagation(); flee(e.clientX ?? (e.touches && e.touches[0] && e.touches[0].clientX), e.clientY ?? (e.touches && e.touches[0] && e.touches[0].clientY)); };
  ynNo.addEventListener("pointerenter", fleeEv);
  ynNo.addEventListener("pointerdown", fleeEv);
  ynNo.addEventListener("touchstart", fleeEv, { passive: false });
  ynNo.addEventListener("click", fleeEv);
  ynNo.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { fleeEv(e); ynYes.focus(); } });
  addEventListener("pointermove", e => { // the mouse only has to come close
    if (ynDone || e.pointerType === "touch" || !gate.classList.contains("yn")) return;
    const r = ynNo.getBoundingClientRect();
    const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right), dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(dx, dy) < 40) flee(e.clientX, e.clientY);
  });
  ynYes.addEventListener("click", async () => {
    if (ynDone) return;
    ynDone = true;
    ynNo.remove();
    mood("yay");
    ynMsg.textContent = "Doğru cevap";
    await wait(900);
    finish(ynMsg);
  });

  envEl.addEventListener("animationend", e => { if (e.target === envEl && /env-(nope|yay)/.test(e.animationName)) envWrap.classList.remove("nope", "yay"); });
  envEl.addEventListener("click", ask);
  envEl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ask(); } });

  const seek = /t=([\d.]+)/.exec(location.hash); // e.g. #t=20 skips the envelope and jumps to that moment
  if (seek) {
    opened = true; envWrap.remove(); newBouquet(0);
    bouquet.born = performance.now() - (+seek[1] / speed) * 1000;
  }
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
