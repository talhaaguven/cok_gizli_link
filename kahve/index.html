<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kilitli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root { --night: #0d0b24; --ink: #f3e9f4; --soft: #b9a9c9; --pink: #f29cc0; --deep: #c95f94; --gold: #e8c98a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 12%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 64% 34%, #ffe9f3 50%, transparent 51%),
      radial-gradient(1px 1px at 28% 62%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 70%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 8% 84%, #ffe9f3 50%, transparent 51%),
      radial-gradient(1px 1px at 46% 90%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 52% 8%, #fff 50%, transparent 51%),
      radial-gradient(120% 90% at 50% 0%, #241a4a 0%, var(--night) 60%);
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; -webkit-tap-highlight-color: transparent;
  }
  main { width: 100%; max-width: 340px; text-align: center; visibility: hidden; }
  main.on { visibility: visible; animation: in .6s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .planet { position: relative; width: 132px; height: 132px; margin: 0 auto 28px; }
  .globe {
    position: absolute; inset: 16px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ffd3e6 0%, var(--pink) 38%, var(--deep) 74%, #7a2f62 100%);
    box-shadow: 0 0 46px rgba(242, 156, 192, .35);
  }
  .ring {
    position: absolute; left: -6px; right: -6px; top: 50%; height: 34px; margin-top: -17px;
    border: 2px solid rgba(232, 201, 138, .75); border-radius: 50%; transform: rotate(-18deg);
    clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
  }
  .hole {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -14px 0 0 -8px;
    border-radius: 50%; background: #3b1436;
  }
  .hole::after {
    content: ""; position: absolute; left: 5px; top: 11px; width: 6px; height: 15px;
    border-radius: 0 0 3px 3px; background: #3b1436;
  }
  main.busy .globe { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 70px rgba(242, 156, 192, .7); } }
  main.no .planet { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

  h1 { font-size: 28px; font-weight: 500; font-style: italic; margin: 0 0 6px; }
  p { margin: 0 0 20px; font-size: 18px; line-height: 1.35; color: var(--soft); }
  section { display: none; }
  section.on { display: block; }
  input {
    width: 100%; height: 50px; padding: 0 16px; margin-bottom: 12px; text-align: center;
    font: inherit; font-size: 20px; color: var(--ink); letter-spacing: .04em;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(243, 233, 244, .28); border-radius: 25px; outline: none;
  }
  input:focus { border-color: var(--pink); }
  button {
    width: 100%; height: 50px; border: 0; border-radius: 25px; cursor: pointer;
    font: inherit; font-size: 20px; color: #2a1030; background: var(--pink);
  }
  button:active { transform: scale(.98); }
  button.quiet { height: 44px; margin-top: 6px; background: none; color: var(--soft); font-size: 17px; text-decoration: underline; text-underline-offset: 4px; }
  .note { margin: 14px 0 0; font-size: 16px; }
  #msg { min-height: 24px; margin: 14px 0 0; font-size: 17px; color: var(--gold); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main id="box">
  <div class="planet"><div class="globe"></div><div class="ring"></div><div class="hole"></div></div>

  <section id="v-pass">
    <h1>Bu gezegen kilitli</h1>
    <p>Girmek için parolayı yaz.</p>
    <form id="f">
      <input id="pw" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Parola" placeholder="Parola">
      <button type="submit">Aç</button>
    </form>
    <button class="quiet" id="to-bio" type="button" hidden></button>
  </section>

  <section id="v-bio">
    <h1>Bu gezegen kilitli</h1>
    <p>Sadece sahibi girebilir.</p>
    <button id="bio" type="button"></button>
    <button class="quiet" id="to-pass" type="button">Parola ile gir</button>
  </section>

  <section id="v-new">
    <h1>Yeni parolanı belirle</h1>
    <p>Bu parola geçiciydi. Kendine yeni bir tane seç; kısa süre içinde geçerli olur.</p>
    <form id="nf">
      <input id="np" type="text" maxlength="60" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Yeni parola" placeholder="Yeni parola">
      <button type="submit">Kaydet</button>
    </form>
    <p class="note" id="new-note"></p>
    <button class="quiet" id="new-skip" type="button">Şimdi değil</button>
  </section>

  <section id="v-enrol">
    <h1>Parola doğru</h1>
    <p id="enrol-text"></p>
    <button id="enrol" type="button"></button>
    <button class="quiet" id="skip" type="button">Şimdi değil</button>
  </section>

  <div id="msg" role="status"></div>
</main>

  const K_KEY = "gezegen-anahtar", K_CRED = "gezegen-kimlik", K_SESSION = "gezegen-oturum";
  const K_NEXT = "gezegen-yeni-anahtar";   // key of the password she chose, until the site is rebuilt with it
  const K_MAIL = "gezegen-yeni-posta";     // the sealed new password, kept until the e-mail really went out

  const $ = id => document.getElementById(id);
  const box = $("box"), msg = $("msg");
  const enc = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const store = {
    get(area, k) { try { return area.getItem(k); } catch { return null; } },
    set(area, k, v) { try { area.setItem(k, v); } catch {} },
    del(area, k) { try { area.removeItem(k); } catch {} },
  };
  const local = () => window.localStorage, session = () => window.sessionStorage;

  // Same rule as build.mjs: capitals, Turkish i/ı and extra spaces do not matter.
  const norm = s => s.normalize("NFC").trim().replace(/\s+/g, " ").replace(/[İIı]/g, "i").toLowerCase();

  async function keyFromPassword(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(pw)), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: dec(P.salt), iterations: P.iter }, base, 256);
    return enc(bits);
  }
  async function open(keyB64) {
    try {
      const key = await crypto.subtle.importKey("raw", dec(keyB64), "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: dec(P.iv) }, key, dec(P.data));
      return JSON.parse(new TextDecoder().decode(plain)); // { html, cfg }
    } catch { return null; }
  }
  async function openAny(keys) {
    for (const key of keys) { if (!key) continue; const p = await open(key); if (p) return { key, ...p }; }
    return null;
  }
  // Only the owner's private key (lock/private-key.pem, never published) can read this back.
  async function seal(text, pub) {
    const k = await crypto.subtle.importKey("spki", dec(pub), { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
    return enc(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, k, new TextEncoder().encode(text)));
  }
  async function deliver(cfg) {
    const code = store.get(local(), K_MAIL);
    if (!code || !cfg.accessKey) return;
    const f = new FormData();
    f.append("access_key", cfg.accessKey); f.append("subject", cfg.mailSubject); f.append("from_name", "Gezegen");
    f.append("message", cfg.mailText + "\n\n" + code);
    const stop = new AbortController(), timer = setTimeout(() => stop.abort(), 6000);
    try { const r = await fetch("https://api.web3forms.com/submit", { method: "POST", body: f, signal: stop.signal }); if (r.ok) store.del(local(), K_MAIL); }
    catch {} // no network: it stays waiting and is sent on the next visit
    clearTimeout(timer);
  }
  // Replace this lock page with the real one. Must wait until the lock page has finished
  // parsing, otherwise write() appends to it instead of replacing it.
  function render(html) {
    const swap = () => setTimeout(() => { document.open(); document.write(html); document.close(); }, 0);
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", swap, { once: true });
    else swap();
  }

  const ua = navigator.userAgent;
  const bioName = /iPhone|iPad|iPod/.test(ua) ? "Face ID" : /Macintosh/.test(ua) ? "Touch ID" : "Parmak izi";
  const hasWebAuthn = !!(window.PublicKeyCredential && navigator.credentials);
  async function canEnrol() {
    try { return hasWebAuthn && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
    catch { return false; }
  }
  const enrolled = () => hasWebAuthn && store.get(local(), K_KEY) && store.get(local(), K_CRED);
  function forget() { store.del(local(), K_KEY); store.del(local(), K_CRED); store.del(local(), K_NEXT); }

  function show(view, text) {
    for (const v of ["v-pass", "v-bio", "v-new", "v-enrol"]) $(v).classList.toggle("on", v === view);
    say(text || "");
    box.classList.add("on");
    if (view === "v-pass") $("to-bio").hidden = !enrolled();
  }
  function say(text) { msg.textContent = text; }
  function busy(on) { box.classList.toggle("busy", on); }
  function refuse(text) {
    say(text); box.classList.remove("no"); void box.offsetWidth; box.classList.add("no");
  }

  let page = null; // { key, html, cfg } once unlocked

  // What comes after a successful unlock: choose a new password (if this one is temporary),
  // offer the fingerprint/face sensor, then show the real page.
  async function next(typed) {
    if (typed && page.cfg.temporary && !page.askedNew && !store.get(local(), K_NEXT)) {
      page.askedNew = true;
      $("new-note").textContent = page.cfg.note || "";
      show("v-new"); $("np").focus();
      return;
    }
    if (typed && !page.askedEnrol && !enrolled() && await canEnrol()) {
      page.askedEnrol = true;
      $("enrol-text").textContent = `Bir dahaki sefer parola yerine ${bioName} ile girmek ister misin?`;
      $("enrol").textContent = `${bioName}'yi aç`;
      return show("v-enrol");
    }
    if (store.get(local(), K_MAIL)) { busy(true); await deliver(page.cfg); busy(false); }
    render(page.html);
  }
  function unlocked(p) {
    page = p;
    store.set(session(), K_SESSION, p.key);
    if (store.get(local(), K_NEXT) === p.key) store.del(local(), K_NEXT); // the new password is live now
    if (enrolled()) store.set(local(), K_KEY, p.key);
  }

  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = $("pw").value;
    if (!pw.trim()) return;
    busy(true); say("Kontrol ediliyor…");
    const p = await openAny([await keyFromPassword(pw)]);
    busy(false);
    if (!p) { $("pw").value = ""; return refuse("Olmadı, bir daha dene."); }
    unlocked(p);
    next(true);
  });

  $("nf").addEventListener("submit", async e => {
    e.preventDefault();
    const np = $("np").value.trim();
    if (norm(np).length < 6) return refuse("En az 6 karakter olsun.");
    busy(true); say("Kaydediliyor…");
    const key = await keyFromPassword(np);
    if (key === page.key) { busy(false); return refuse("Bu zaten şimdiki parola. Başka bir tane seç."); }
    try {
      store.set(local(), K_MAIL, await seal(np, page.cfg.pub));
      store.set(local(), K_NEXT, key);
    } catch { busy(false); return refuse("Kaydedilemedi, bir daha dene."); }
    await deliver(page.cfg); // if this fails it is retried on the next visits
    busy(false);
    next(true);
  });
  $("new-skip").addEventListener("click", () => next(true));

  $("enrol").addEventListener("click", async () => {
    try {
      const cred = await navigator.credentials.create({ publicKey: {
        rp: { name: "Gezegen" },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "gezegen", displayName: "Gezegen sakini" },
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "discouraged" },
        attestation: "none", timeout: 60000,
      } });
      store.set(local(), K_CRED, enc(cred.rawId));
      store.set(local(), K_KEY, page.key);
      next(true);
    } catch { refuse("Olmadı. Tekrar dene ya da şimdilik geç."); }
  });
  $("skip").addEventListener("click", () => next(true));

  $("bio").addEventListener("click", async () => {
    try {
      await navigator.credentials.get({ publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ type: "public-key", id: dec(store.get(local(), K_CRED)), transports: ["internal"] }],
        userVerification: "required", timeout: 60000,
      } });
    } catch { return refuse("Olmadı, bir daha dene."); }
    // After the site is rebuilt with the password she chose, the saved new key takes over by itself.
    const p = await openAny([store.get(local(), K_KEY), store.get(local(), K_NEXT)]);
    if (!p) { forget(); return show("v-pass", "Parola değişmiş. Yeni parolayı yaz."); }
    unlocked(p);
    next(false);
  });
  $("to-pass").addEventListener("click", () => { show("v-pass"); $("pw").focus(); });
  $("to-bio").addEventListener("click", () => show("v-bio"));

  (async () => {
    if (location.hash === "#kilit-sifirla") { forget(); store.del(local(), K_MAIL); store.del(session(), K_SESSION); }
    if (!(window.crypto && crypto.subtle)) {
      show("v-pass", "Bu tarayıcı desteklenmiyor. Safari ya da Chrome ile aç.");
      return;
    }
    const s = store.get(session(), K_SESSION);
    if (s) {
      const p = await openAny([s]);
      if (p) { page = p; return next(false); }
      store.del(session(), K_SESSION);
    }
    $("bio").textContent = `${bioName} ile aç`;
    $("to-bio").textContent = `${bioName} ile gir`;
    show(enrolled() ? "v-bio" : "v-pass");
  })();
})();
</script>
</body>
</html>
